name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apzhub
          POSTGRES_PASSWORD: apzhub
          POSTGRES_DB: apzhub
        ports:
          - 54334:5432
        options: >-
          --health-cmd "pg_isready -U apzhub -d apzhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3300
      APP_URL: http://localhost:3300
      NEXT_PUBLIC_APP_URL: http://localhost:3300
      ALLOW_DEV_REGISTRATION: "false"
      NEXT_PUBLIC_ALLOW_DEV_REGISTRATION: "false"
      PLATFORM_VERSION: 0.0.0
      BUILD_NUMBER: ci
      DATABASE_URL: postgresql://apzhub:apzhub@localhost:54334/apzhub
      DATABASE_URL_TEST: postgresql://apzhub:apzhub@localhost:54334/apzhub_test
      REDIS_URL: redis://localhost:6380
      BETTER_AUTH_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
      BETTER_AUTH_URL: http://localhost:3300
      EMAIL_FROM: noreply@apzhub.local

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm db:migrate
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm build-storybook
      - run: pnpm test:e2e

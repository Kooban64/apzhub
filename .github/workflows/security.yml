# QEP external verification — security pack (F11)

# workflow_dispatch target for APZHUB_SECURITY_DISPATCH_WORKFLOW=security.yml
# Live mode: unset APZHUB_SECURITY_DISPATCH_MODE (do not use record_only).
# Prefer runner clusters (apzqep-pentest / Greenbone) when self-hosted;
# this workflow is the GitHub Actions channel for the same ingest contract.

name: QEP Security Pack

on:
  workflow_dispatch:
    inputs:
      changeEventId:
        description: Durable APZQEP changeEventId
        required: true
        type: string
      domains:
        description: Comma-separated (trivy,semgrep,nuclei,zap[,greenbone])
        required: false
        default: "trivy,semgrep,nuclei,zap"
        type: string
      repositoryFullName:
        description: owner/repo of the change under test
        required: false
        type: string
      correlationId:
        description: Correlation ID from QEP dispatch
        required: false
        type: string
      sha:
        description: Commit SHA when known
        required: false
        type: string
      targetUrl:
        description: Authorized DAST target URL (Nuclei/ZAP)
        required: false
        type: string
      branch:
        description: Branch when known
        required: false
        type: string
      assistOrigin:
        description: QEP assist origin marker
        required: false
        type: string
      pack:
        description: Pack id (security)
        required: false
        default: "security"
        type: string

jobs:
  security-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout subject repo (optional)
        if: ${{ inputs.repositoryFullName != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repositoryFullName }}
          ref: ${{ inputs.sha != '' && inputs.sha || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record dispatch context
        run: |
          echo "changeEventId=${{ inputs.changeEventId }}"
          echo "domains=${{ inputs.domains }}"
          echo "correlationId=${{ inputs.correlationId }}"
          echo "targetUrl=${{ inputs.targetUrl }}"

      - name: Placeholder — run scanners then ingest SARIF/findings
        env:
          QEP_INGEST_URL: ${{ secrets.QEP_INGEST_URL }}
          QEP_INGEST_TOKEN: ${{ secrets.QEP_INGEST_TOKEN }}
        run: |
          echo "::notice::Wire Trivy/Semgrep/Nuclei/ZAP (or call self-hosted apzqep-pentest) here."
          echo "::notice::POST normalised evidence to \$QEP_INGEST_URL/api/v1/qep/automation/executions"
          echo "::notice::providerId=security · changeEventId=${{ inputs.changeEventId }}"
          if [ -z "${QEP_INGEST_URL}" ]; then
            echo "QEP_INGEST_URL secret not set — stub OK for workflow_dispatch proof."
          fi

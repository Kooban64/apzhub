# APZHUB — route apex + staging to Docker-published ports (Path B: host nginx already owns :80/:443).
# Enable: sudo cp deploy/nginx/00-apzhub-apzportal.conf /etc/nginx/sites-available/
#         sudo ln -sf /etc/nginx/sites-available/00-apzhub-apzportal.conf /etc/nginx/sites-enabled/00-apzhub-apzportal.conf
# Name with 00- so it loads before apzportal-wildcard; remove apzportal.apzor.com from wildcard server_name.

server {
    listen 80;
    listen [::]:80;
    server_name apzportal.apzor.com staging.apzportal.apzor.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.apzportal.apzor.com;

    ssl_certificate     /etc/letsencrypt/live/apzportal.apzor.com-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apzportal.apzor.com-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 86400s;
        client_max_body_size 50m;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name apzportal.apzor.com;

    ssl_certificate     /etc/letsencrypt/live/apzportal.apzor.com-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apzportal.apzor.com-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 86400s;
        client_max_body_size 50m;
    }
}

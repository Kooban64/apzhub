services:
  n8n:
    image: ${APZ_IMAGE_N8N}
    container_name: apz-n8n
    restart: unless-stopped
    networks:
      - apz_frontend
      - apz_backend
    depends_on:
      apzpg:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N8N_PUBLISH_PORT:-15678}:5678"
    environment:
      TZ: ${TZ:-UTC}
      N8N_HOST: ${N8N_HOST:-0.0.0.0}
      N8N_PORT: "5678"
      # Do not set N8N_PATH for apzworkflows (root URL). To run under a path on a shared host, set N8N_PATH in .env and mirror nginx (see docs).
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      # SMTP: set N8N_EMAIL_MODE=smtp plus shared SMTP_* in .env (see env.production).
      N8N_EMAIL_MODE: ${N8N_EMAIL_MODE:-}
      N8N_SMTP_HOST: ${SMTP_HOST:-}
      N8N_SMTP_PORT: ${SMTP_PORT:-587}
      N8N_SMTP_USER: ${SMTP_USER:-}
      N8N_SMTP_PASS: ${SMTP_PASS:-}
      N8N_SMTP_SENDER: ${SMTP_FROM:-}
      # Optional: set N8N_DB_TYPE=postgresdb for stronger workflow durability.
      # Defaults keep current local storage behavior.
      DB_TYPE: ${N8N_DB_TYPE:-sqlite}
      DB_POSTGRESDB_HOST: ${N8N_DB_POSTGRESDB_HOST:-apzpg}
      DB_POSTGRESDB_PORT: ${N8N_DB_POSTGRESDB_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${N8N_DB_POSTGRESDB_DATABASE:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_POSTGRESDB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_POSTGRESDB_PASSWORD:-n8n}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:5678/n8n/healthz || wget -q -O /dev/null http://127.0.0.1:5678/n8n/ || wget -q -O /dev/null http://127.0.0.1:5678/healthz || wget -q -O /dev/null http://127.0.0.1:5678/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  n8n_data:

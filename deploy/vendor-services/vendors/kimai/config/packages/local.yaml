# Force public URL scheme/host so Symfony does not emit http:// redirects behind TLS.
# Without this, Secure session cookies are skipped on the intermediate http hop → login loop.
# If you change the Kimai hostname, update host here and run: docker compose exec kimai /opt/kimai/bin/console kimai:reload --env=prod
parameters:
    router.request_context.scheme: 'https'
    router.request_context.host: 'apztime.apzportal.apzor.com'

# Default SameSite=Lax is fine for direct visits; some portal/embed + Chrome combinations still
# omit the session cookie on POST → CSRF fails → 302 back to /en/login (looks like “bad password”).
framework:
    session:
        cookie_secure: true
        cookie_samesite: none

kimai:
    saml:
        provider: authentik
        activate: true
        title: Login with SSO
        mapping:
            - { saml: $http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress, kimai: email }
            - { saml: $http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name, kimai: alias }
        roles:
            resetOnLogin: true
            attribute: http://schemas.xmlsoap.org/claims/Group
            mapping:
                - { saml: platform-admin, kimai: ROLE_SUPER_ADMIN }
                - { saml: portal-admin, kimai: ROLE_SUPER_ADMIN }
                - { saml: kimai-admin, kimai: ROLE_SUPER_ADMIN }
                - { saml: manager, kimai: ROLE_ADMIN }
                - { saml: pm, kimai: ROLE_TEAMLEAD }
        connection:
            idp:
                entityId: "https://apzauth.apzportal.apzor.com/application/saml/kimai-saml/metadata/"
                singleSignOnService:
                    url: "https://apzauth.apzportal.apzor.com/application/saml/kimai-saml/sso/binding/redirect/"
                    binding: "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect"
                singleLogoutService:
                    url: "https://apzauth.apzportal.apzor.com/application/saml/kimai-saml/slo/binding/redirect/"
                    binding: "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect"
                x509cert: ""
            sp:
                entityId: "https://apztime.apzportal.apzor.com/"
                assertionConsumerService:
                    url: "https://apztime.apzportal.apzor.com/auth/saml/acs"
                    binding: "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST"
                singleLogoutService:
                    url: "https://apztime.apzportal.apzor.com/auth/saml/logout"
                    binding: "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect"
            baseurl: "https://apztime.apzportal.apzor.com/auth/saml/"
            strict: true
            debug: false

security:
    firewalls:
        secured_area:
            form_login:
                check_path: saml_acs
            logout:
                path: saml_logout

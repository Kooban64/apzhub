components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session cookie resolved server-side.
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Sort:
      name: sort
      in: query
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        pattern: "^ws_[0-9a-fA-F]{32}$"
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: "^proj_[0-9a-fA-F]{32}$"
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        pattern: "^task_[0-9a-fA-F]{32}$"
    SupportRequestId:
      name: supportRequestId
      in: path
      required: true
      schema:
        type: string
        pattern: "^sreq_[0-9a-fA-F]{32}$"
      example: sreq_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1
    ArticleId:
      name: articleId
      in: path
      required: true
      schema:
        type: string
        pattern: "^sart_[0-9a-fA-F]{32}$"
      example: sart_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa5
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^sorg_[0-9a-fA-F]{32}$"
      example: sorg_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa2
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        pattern: "^sgrp_[0-9a-fA-F]{32}$"
      example: sgrp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa3
    SupportUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        pattern: "^suser_[0-9a-fA-F]{32}$"
      example: suser_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa4
    TestingRequirementId:
      name: requirementId
      in: path
      required: true
      schema: &TestingIdSchema
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,127}$"
    TestingPlanId:
      name: planId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingSuiteId:
      name: suiteId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingCaseId:
      name: caseId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingExecutionId:
      name: executionId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingStepId:
      name: stepId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingEvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingImportId:
      name: importId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingCoverageId:
      name: coverageId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingDefectId:
      name: defectId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingCertificationId:
      name: certificationId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingApprovalId:
      name: approvalId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingRelationshipId:
      name: relationshipId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingReleaseId:
      name: releaseId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingResourcePathId:
      name: resourceId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingPipelineId:
      name: pipelineId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingPipelineRunId:
      name: runId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingEngineeringSnapshotId:
      name: snapshotId
      in: path
      required: true
      schema: *TestingIdSchema
    PipelineOwner:
      name: owner
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$"
    PipelineRepo:
      name: repo
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$"
    PipelineWorkflowId:
      name: workflowId
      in: path
      required: true
      schema: *TestingIdSchema
    PipelineProviderRunId:
      name: runId
      in: path
      required: true
      schema: *TestingIdSchema
    PipelineJobId:
      name: jobId
      in: path
      required: true
      schema: *TestingIdSchema
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Permission or policy denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Mapping or revision conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Provider or dependency unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotImplemented:
      description: Capability not supported by provider
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected platform failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Meta:
      type: object
      required: [requestId, correlationId]
      properties:
        requestId:
          type: string
          format: uuid
        correlationId:
          type: string
    Page:
      type: object
      required: [cursor, nextCursor, limit, hasMore]
      properties:
        cursor:
          type: ["string", "null"]
        nextCursor:
          type: ["string", "null"]
        limit:
          type: integer
        hasMore:
          type: boolean
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
        meta:
          $ref: "#/components/schemas/Meta"
    TestingResource:
      type: object
      description: >
        Generic Testing Platform Service resource. Full domain contracts live in the
        Testing service SDK; this schema preserves OpenAPI coverage while avoiding
        backend-specific fields in the public workbench contract.
      additionalProperties: true
    TestingResourceInput:
      type: object
      description: Generic JSON request body for Testing route handlers.
      additionalProperties: true
    TestingResourceSuccess:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/TestingResource"
        meta:
          $ref: "#/components/schemas/Meta"
    TestingResourceCollection:
      type: object
      required: [data, page, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TestingResource"
        page:
          $ref: "#/components/schemas/Page"
        meta:
          $ref: "#/components/schemas/Meta"
    PipelineImportFromProviderRequest:
      type: object
      required: [owner, repo, runId]
      additionalProperties: false
      properties:
        owner:
          type: string
          minLength: 1
          maxLength: 128
        repo:
          type: string
          minLength: 1
          maxLength: 128
        runId:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 128
            - type: integer
              minimum: 1
        pipelineKey:
          type: string
          maxLength: 128
        pipelineId:
          type: string
          maxLength: 128
    EngineeringIntelligenceScopeRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: object
          additionalProperties: true
          description: Optional engineering scope (product/release/tenant filters).
        weights:
          type: object
          additionalProperties:
            type: number
          description: Optional quality score weight overrides.
        label:
          type: string
          maxLength: 256
    ReportOutputFormat:
      type: string
      enum: [html, markdown, pdf, docx, json, csv]
    ValidateReportRequest:
      type: object
      required: [reportType, outputFormat]
      additionalProperties: false
      properties:
        reportType:
          type: string
          maxLength: 128
        templateId:
          type: string
          maxLength: 128
        outputFormat:
          $ref: "#/components/schemas/ReportOutputFormat"
        parameters:
          type: object
          additionalProperties: true
          description: Pre-computed report parameters (metrics, tables, lists, summaries, text, metadata).
    GenerateReportRequest:
      type: object
      required: [reportType, outputFormat]
      additionalProperties: false
      properties:
        reportType:
          type: string
          maxLength: 128
        templateId:
          type: string
          maxLength: 128
        outputFormat:
          $ref: "#/components/schemas/ReportOutputFormat"
        parameters:
          type: object
          additionalProperties: true
          description: Pre-computed report parameters (metrics, tables, lists, summaries, text, metadata).
        organisationId:
          type: string
          maxLength: 128
    SearchQueryRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          $ref: "#/components/schemas/SearchQuery"
        profileId: { type: string, maxLength: 128 }
        sessionId: { type: string, maxLength: 128 }
        correlationId: { type: string, maxLength: 128 }
    SearchValidateRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          $ref: "#/components/schemas/SearchQuery"
    SearchSuggestionsRequest:
      type: object
      additionalProperties: false
      required: [keywords]
      properties:
        keywords: { type: string, minLength: 1, maxLength: 512 }
        phrase: { type: string, minLength: 1, maxLength: 512 }
        pageSize: { type: integer, minimum: 1, maximum: 20 }
    SearchQuery:
      type: object
      additionalProperties: false
      properties:
        keywords: { type: string, minLength: 1, maxLength: 512 }
        phrase: { type: string, minLength: 1, maxLength: 512 }
        filters:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/SearchFilter"
        sorts:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [field, direction]
            properties:
              field: { type: string, maxLength: 64 }
              direction: { type: string, enum: [asc, desc] }
        scopes:
          type: array
          maxItems: 8
          items:
            type: string
            enum: [platform, organisation, tenant, workspace, product, personal]
        collections:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 128 }
        products:
          type: array
          maxItems: 16
          items:
            type: string
            enum: [projects, support, documents, testing, reporting, workflow, analytics, identity, administration]
        page: { type: integer, minimum: 1, maximum: 10000 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        includeFacets: { type: boolean }
        includeHighlights: { type: boolean }
        includeSuggestions: { type: boolean }
    SearchFilter:
      type: object
      additionalProperties: false
      required: [field, op]
      properties:
        field: { type: string, maxLength: 64 }
        op: { type: string, enum: [eq, neq, in, nin, exists, range] }
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items: { type: string }
        from:
          oneOf: [{ type: string }, { type: number }]
        to:
          oneOf: [{ type: string }, { type: number }]
    UpdateSearchProviderRequest:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, maxLength: 256 }
        enabled: { type: boolean }
        ownership: { type: string, enum: [platform, tenant, organisation] }
        version: { type: string, maxLength: 64 }
    CreateSearchConfigurationRequest:
      type: object
      additionalProperties: false
      required: [configuration]
      properties:
        label: { type: string, maxLength: 256 }
        configuration:
          $ref: "#/components/schemas/SearchConfigurationBody"
    UpdateSearchConfigurationRequest:
      type: object
      additionalProperties: false
      required: [configuration]
      properties:
        label: { type: string, maxLength: 256 }
        configuration:
          $ref: "#/components/schemas/SearchConfigurationBody"
    ValidateSearchConfigurationRequest:
      type: object
      additionalProperties: false
      required: [configuration]
      properties:
        configuration:
          $ref: "#/components/schemas/SearchConfigurationBody"
    SearchConfigurationBody:
      type: object
      additionalProperties: false
      required:
        - defaultPageSize
        - maxPageSize
        - maxKeywordLength
        - allowedProviderKinds
        - enforceTenantIsolation
        - enforceOrganisationIsolation
        - enforcePermissionFilter
      properties:
        defaultPageSize: { type: integer, minimum: 1, maximum: 100 }
        maxPageSize: { type: integer, minimum: 1, maximum: 100 }
        maxKeywordLength: { type: integer, minimum: 1, maximum: 2048 }
        allowedProviderKinds:
          type: array
          items:
            type: string
            enum: [opensearch, elasticsearch, postgresql_fts, meilisearch, typesense, azure_ai_search, vector_future, custom]
        enforceTenantIsolation: { type: boolean, enum: [true] }
        enforceOrganisationIsolation: { type: boolean, enum: [true] }
        enforcePermissionFilter: { type: boolean, enum: [true] }
    CreateSearchCollectionRequest:
      type: object
      additionalProperties: false
      required: [name, scope]
      properties:
        name: { type: string, maxLength: 256 }
        scope:
          type: string
          enum: [platform, organisation, tenant, workspace, product, personal]
        productIds:
          type: array
          items:
            type: string
        enabled: { type: boolean }
    UpdateSearchCollectionRequest:
      type: object
      additionalProperties: false
      properties:

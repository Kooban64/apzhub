    # ---------------------------------------------------------------------------
    # Support domain schemas (OSS-110-11)
    # ---------------------------------------------------------------------------
    SupportTicketStatus:
      type: string
      enum: [new, open, pending, closed, merged, unknown]

    SupportTicketPriority:
      type: string
      enum: [low, normal, high, urgent]

    SupportRequest:
      type: object
      required:
        [
          id,
          tenantId,
          title,
          groupId,
          requesterId,
          status,
          priority,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          pattern: "^sreq_[0-9a-fA-F]{32}$"
          example: sreq_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1
        tenantId:
          type: string
        displayId:
          type: string
        title:
          type: string
        groupId:
          type: string
          pattern: "^sgrp_[0-9a-fA-F]{32}$"
          example: sgrp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa3
        requesterId:
          type: string
          pattern: "^suser_[0-9a-fA-F]{32}$"
          example: suser_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa4
        assigneeId:
          type: string
          pattern: "^suser_[0-9a-fA-F]{32}$"
          nullable: true
        organizationId:
          type: string
          pattern: "^sorg_[0-9a-fA-F]{32}$"
          nullable: true
        status:
          $ref: "#/components/schemas/SupportTicketStatus"
        priority:
          $ref: "#/components/schemas/SupportTicketPriority"
        tags:
          type: array
          items:
            type: string
        closedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSupportRequestBody:
      type: object
      required: [title, groupId, requesterId]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500

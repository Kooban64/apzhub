            enum: [email, sms, push, in_app, webhook, microsoft_teams, slack, future]
        subjectTemplate: { type: string, maxLength: 512 }
        bodyTemplate: { type: string, maxLength: 10000 }
        locale: { type: string, maxLength: 32 }
        organisationId: { type: string, maxLength: 128 }
    UpdateNotificationTemplateRequest:

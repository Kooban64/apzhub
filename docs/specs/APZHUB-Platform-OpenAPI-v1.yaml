  # ---------------------------------------------------------------------------
  # Support Requests (OSS-110-11)
  # ---------------------------------------------------------------------------
  /support-requests:
    get:
      operationId: listSupportRequests
      tags: [Support Requests]
      summary: List support requests
      x-required-permission: support.requests.list
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: sort
          in: query
          schema:
            type: string
            enum: [title, displayId, status, priority, createdAt, updatedAt]
        - $ref: "#/components/parameters/Order"
        - name: status
          in: query
          schema:
            type: string
            enum: [new, open, pending, closed, merged, unknown]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, normal, high, urgent]
        - name: ownerId
          in: query
          description: HTTP alias for assigneeId
          schema:
            type: string
            pattern: "^suser_[0-9a-fA-F]{32}$"
        - name: assigneeId
          in: query
          schema:
            type: string
            pattern: "^suser_[0-9a-fA-F]{32}$"
        - name: customerId
          in: query
          description: HTTP alias for requesterId
          schema:
            type: string
            pattern: "^suser_[0-9a-fA-F]{32}$"
        - name: requesterId
          in: query
          schema:
            type: string
            pattern: "^suser_[0-9a-fA-F]{32}$"
        - name: organizationId
          in: query
          schema:
            type: string
            pattern: "^sorg_[0-9a-fA-F]{32}$"
        - name: groupId
          in: query
          schema:
            type: string
            pattern: "^sgrp_[0-9a-fA-F]{32}$"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Support request collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestCollection"
              examples:
                sample:
                  value:
                    data:
                      - id: sreq_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1
                        title: Cannot login
                        status: open
                        priority: normal
                        groupId: sgrp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa3
                        requesterId: suser_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa4
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createSupportRequest
      tags: [Support Requests]
      summary: Create support request
      x-required-permission: support.requests.create
      parameters:
        - name: idempotency-key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportRequestBody"
            examples:
              sample:
                value:
                  title: Cannot login to portal
                  groupId: sgrp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa3
                  requesterId: suser_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa4
                  priority: high
      responses:
        "201":
          description: Support request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"


openapi: 3.1.0
info:
  title: APZHUB Platform HTTP API
  version: 1.8.0
  description: |
    Production HTTP surface over PlatformServiceGateway (OSS-110-07, OSS-110-11).
    Routes contain no business logic and never call integration adapters directly.
    Support domain (OSS-110-11): vendor-neutral ticket management via Zammad or other
    support engines. All IDs use APZHUB global ID format (sreq_, sorg_, sgrp_, suser_, sart_).
  contact:
    name: APZHUB Platform
servers:
  - url: /api/v1
    description: Platform API v1
tags:
  - name: Health
  - name: Workspaces
  - name: Projects
  - name: Teams
  - name: Tasks
  - name: Support Requests
    description: >
      Vendor-neutral support ticket operations. DELETE = soft-close (not hard delete).
      Engine-specific fields are never exposed; use APZHUB global IDs only.
  - name: Support Articles
    description: >
      Support conversation articles. POST /notes creates internal notes (visibility=internal,
      channel=note). POST /replies creates customer replies (visibility=public, public channel only).
      Visibility cannot be overridden by the caller.
  - name: Support Organisations
    description: Support organisation management (American spelling in URLs).
  - name: Support Groups
    description: Support group / queue management.
  - name: Support Users
    description: >
      Support-domain user operations (agents / customers). GET /support-users supports
      listing, email/login lookup, and text search via query parameters.
  - name: Support Search
    description: >
      Unified support search across tickets, organisations, groups, users, and articles.
      Requires q or query parameter.
  - name: Support History
    description: Read-only audit timeline for support requests.
  - name: Support Analytics
    description: >
      Read-only support intelligence snapshot. Data availability depends on provider;
      missing fields are omitted rather than defaulted.
  - name: Testing Requirements
    description: Testing requirement metadata and links to work items.
  - name: Testing Plans
    description: Testing plan lifecycle and clone operations.
  - name: Testing Suites
    description: Testing suite lifecycle and clone operations.
  - name: Testing Cases
    description: Test case metadata and human review transitions.
  - name: Testing Executions
    description: Manual execution lifecycle; these APIs do not execute runners.
  - name: Testing Evidence
    description: Evidence metadata only. Binary upload is not implemented by these JSON routes.
  - name: Testing Automation
    description: Automation import metadata and validation; no runner execution is performed.
  - name: Testing Coverage
    description: Coverage metrics and recompute requests.
  - name: Testing Defects
    description: Vendor-neutral testing defect links.
  - name: Testing Quality
    description: Quality summaries, trends, regression, and risk analysis.
  - name: Testing Certification
    description: Certification is human-authorised; recommendations are advisory only.
  - name: Testing Traceability
    description: Traceability links and resource matrices.
  - name: Testing Dashboard
    description: Testing dashboard summary for the Workbench.
  - name: Testing Approvals
    description: Read-only approval records and approval history.
  - name: Testing Release Readiness
    description: Release readiness calculations return isDecision=false and do not approve releases.
  - name: Testing Pipelines
    description: >
      CI/CD pipeline reads (live provider + SoR metadata). Read-focused; optional importFromProvider
      persists a live run into platform SoR. Does not dispatch, rerun, or cancel workflows.
  - name: Testing Engineering Intelligence
    description: >
      Read-focused Engineering Intelligence presentation over existing domain services
      (scores, health, trends, benchmarks, baselines, historical snapshots). No new analytics.
  - name: Platform Reporting
    description: >
      Product-neutral platform reporting presentation — templates, validation, preview/generate,
      generation metadata, and output formats. Handlers call PlatformServiceGateway.reporting only.
  - name: Platform Documents
    description: >
      Canonical Document Platform metadata API (APZDOCS-004). Metadata and version
      descriptors only — no binary upload/download. All traffic via PlatformServiceGateway.
  - name: Platform Search
    description: >
      Canonical Platform Search API (APZSEARCH-007). Query plane via searchExecution*;
      management under /search/management/*. Public index/document HTTP deliberately omitted
      (gateway-only). No Meilisearch DTOs, semantic/vector fields, or legacy gateway.search.
  - name: Platform Notifications
    description: >
      Canonical Notification Platform management API (APZNOTIFY-003).
      Maps 1:1 to gateway.notification.* — metadata and lifecycle only.
      No delivery, providers, workers, queues, Event Bus, or realtime.
      Controlled 503 when APZHUB_NOTIFICATION_ENABLED is false.
  - name: Notification Templates
    description: Notification template metadata (no provider templates).
  - name: Notification Preferences
    description: Channel/category preference metadata only.
  - name: Notification Categories
    description: Canonical notification category catalogue (read).
  - name: Notification Channels
    description: >
      Channel metadata (in_app, email, sms, push, webhook, teams, slack).
      Existence does not imply delivery is implemented (deliveryAvailable=false).
  - name: Notification Recipients
    description: Recipient metadata with safe redaction — no credentials.
  - name: Notification References
    description: Canonical cross-product reference metadata only.
  - name: Notification Audit
    description: Read-only notification audit trail.
  - name: Platform Administration
    description: >
      Management-plane administration metadata and lifecycle only.
      No workbench, runtime admin, user/role/tenant management, provisioning, or live probes.
  - name: Administration Modules
  - name: Administration Categories
  - name: Administration Sections
  - name: Administration Actions
  - name: Administration Permissions
  - name: Administration Registrations
  - name: Administration Policies
  - name: Administration Capabilities
  - name: Administration Navigations
  - name: Administration Shortcuts
  - name: Administration Dashboards
  - name: Administration Widgets
  - name: Administration Metadata
  - name: Administration References
  - name: Administration Audit
  - name: Administration Diagnostics
  - name: Platform Identity Administration
    description: >
      Management-plane identity metadata only — no authentication, login,
      passwords, or provisioning. Returns 503 when APZHUB_IDENTITY_ENABLED is false.
  - name: Identity Users
  - name: Identity Groups
  - name: Identity Roles
  - name: Identity Organisations
  - name: Identity Tenants
  - name: Identity Departments
  - name: Identity Positions
  - name: Identity Memberships
  - name: Identity Service Assignments
  - name: Identity Invitations
  - name: Identity Activation
  - name: Identity Deactivation
  - name: Identity Policies
  - name: Identity Audit
  - name: Identity References
  - name: Identity Diagnostics
  - name: Platform Configuration
    description: >
      Canonical Configuration Platform management API (APZCONFIG-003).
      Maps 1:1 to gateway.configuration.* — metadata and lifecycle only.
      No runtime resolution, apply, feature flags, secrets, hot reload, or Event Bus.
      Controlled 503 when APZHUB_CONFIGURATION_ENABLED is false.
  - name: Configuration Namespaces
    description: Configuration namespace metadata (not OS/Kubernetes namespaces).
  - name: Configuration Groups
    description: Configuration group metadata within namespaces.
  - name: Configuration Versions
    description: Immutable published versions; no rollback execution.
  - name: Configuration Overrides
    description: Override metadata only — no effective-value resolution.
  - name: Configuration Scopes
    description: Canonical scope hierarchy metadata (global → user).
  - name: Configuration Validation
    description: Declarative metadata validation — no remote validator execution.
  - name: Configuration References
    description: Cross-product reference metadata only — no product queries.
  - name: Configuration Audit
    description: Read-only configuration audit trail.
  - name: Platform Observability Administration
    description: >
      Canonical Observability Platform management API (APZOBSERVE-003).
      Maps 1:1 to gateway.observe.* — metadata and lifecycle only.
      No Grafana, Prometheus, Loki, OpenTelemetry, AlertManager, scrape, ingest, or Workbench.
      Controlled 503 when APZHUB_OBSERVE_ENABLED is false.
  - name: Observability Health
  - name: Observability Metrics
  - name: Observability Alerts
  - name: Observability Dashboards
  - name: Observability Logs
  - name: Observability Traces
  - name: Observability Incidents
  - name: Observability Maintenance
  - name: Observability Metadata
  - name: Observability Diagnostics
security:
  - sessionCookie: []
paths:
  /health:
    get:
      operationId: getPlatformApiHealth
      tags: [Health]
      summary: Process health
      security: []
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccess"
        "503":
          description: Gateway unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /readiness:
    get:
      operationId: getPlatformApiReadiness
      tags: [Health]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessSuccess"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /openapi:
    get:
      operationId: getPlatformOpenApi
      tags: [Health]
      summary: OpenAPI document
      security: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, yaml]
      responses:
        "200":
          description: OpenAPI document
  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [Workspaces]
      summary: List workspaces
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
        - name: x-correlation-id
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Workspace collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceCollection"
              examples:
                sample:
                  value:
                    data:
                      - id: ws_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                        tenantId: tenant-1
                        name: Acme
                        slug: acme
                        createdAt: "2026-07-10T00:00:00.000Z"
                        updatedAt: "2026-07-10T00:00:00.000Z"
                    page:
                      cursor: null
                      nextCursor: null
                      limit: 20
                      hasMore: false
                    meta:
                      requestId: 11111111-1111-4111-8111-111111111111
                      correlationId: 11111111-1111-4111-8111-111111111111
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
  /workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      tags: [Workspaces]
      summary: Get workspace by APZHUB global ID
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List projects
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, all]
        - name: workspaceId
          in: query
          schema:
            type: string
            pattern: "^ws_[0-9a-fA-F]{32}$"
      responses:
        "200":
          description: Project collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create project
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
          description: Validated and propagated via execution metadata; durable idempotency store not implemented in OSS-110-07.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            example:
              workspaceId: ws_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              name: Portal
              identifier: PORT
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [Projects]
      summary: Get project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [Projects]
      summary: Update project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: archiveProject
      tags: [Projects]
      summary: Archive project (soft-retire; not hard-delete)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Archived project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /teams:
    get:
      operationId: listTeams
      tags: [Teams]
      summary: List project team members
      description: TeamService is project-scoped. Requires projectId query parameter.
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
            pattern: "^proj_[0-9a-fA-F]{32}$"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Team member collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /teams/{teamId}:
    get:
      operationId: getTeamMember
      tags: [Teams]
      summary: Get team member by member global ID
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            pattern: "^member_[0-9a-fA-F]{32}$"
        - name: projectId
          in: query
          required: true
          schema:
            type: string
            pattern: "^proj_[0-9a-fA-F]{32}$"
      responses:
        "200":
          description: Team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: List tasks in a project
      description: |
        TaskService is project-scoped. Requires projectId query parameter.
        Unknown query parameters are rejected. workspaceId is accepted for
        client convenience but is not applied as a TaskListFilter field.
      x-required-permission: task.list
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
            pattern: "^proj_[0-9a-fA-F]{32}$"
        - name: workspaceId
          in: query
          schema:
            type: string
            pattern: "^ws_[0-9a-fA-F]{32}$"
        - name: stateId
          in: query
          description: Canonical status global ID (maps to TaskListFilter.statusId)
          schema:
            type: string
            pattern: "^status_[0-9a-fA-F]{32}$"
        - name: assigneeId
          in: query
          schema:
            type: string
            pattern: "^user_[0-9a-fA-F]{32}$"
        - name: labelId
          in: query
          schema:
            type: string
            pattern: "^label_[0-9a-fA-F]{32}$"
        - name: priority
          in: query
          schema:
            type: string
            enum: [none, low, medium, high, urgent]
        - name: moduleId
          in: query
          description: Maps to TaskListFilter.projectModuleId
          schema:
            type: string
            pattern: "^module_[0-9a-fA-F]{32}$"
        - name: sprintId
          in: query
          schema:
            type: string
            pattern: "^sprint_[0-9a-fA-F]{32}$"
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: sort
          in: query
          schema:
            type: string
            enum: [title, status, priority, rank, createdAt, updatedAt]
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: Task collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCollection"
              examples:
                sample:
                  value:
                    data:
                      - id: task_dddddddddddddddddddddddddddddddd
                        projectId: proj_bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                        title: Implement API
                        status: open
                        statusId: status_eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
                        priority: medium
                        labelIds: []
                        createdAt: "2026-07-10T00:00:00.000Z"
                        updatedAt: "2026-07-10T00:00:00.000Z"
                    page:
                      cursor: null
                      nextCursor: null
                      limit: 20
                      hasMore: false
                    meta:
                      requestId: 11111111-1111-4111-8111-111111111111
                      correlationId: 11111111-1111-4111-8111-111111111111
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTask
      tags: [Tasks]
      summary: Create task
      x-required-permission: task.create
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
            examples:
              minimal:
                value:
                  projectId: proj_bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  title: Implement API
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{taskId}:
    get:
      operationId: getTask
      tags: [Tasks]
      summary: Get task by APZHUB global ID
      x-required-permission: task.read
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateTask
      tags: [Tasks]
      summary: Update task fields
      x-required-permission: task.update
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: archiveTask
      tags: [Tasks]
      summary: Soft-archive task
      description: Maps to TaskService.archiveTask. Hard-delete is not exposed.
      x-required-permission: task.archive
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Archived task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{taskId}/transition:
    post:
      operationId: transitionTaskStatus
      tags: [Tasks]
      summary: Transition task status
      x-required-permission: task.transition
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionTaskRequest"
      responses:
        "200":
          description: Transitioned task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{taskId}/assignees:
    post:
      operationId: assignTask
      tags: [Tasks]
      summary: Assign task to one or more users
      x-required-permission: task.assign
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTaskRequest"
      responses:
        "200":
          description: Assigned task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{taskId}/assignees/{assigneeId}:
    delete:
      operationId: unassignTaskAssignee

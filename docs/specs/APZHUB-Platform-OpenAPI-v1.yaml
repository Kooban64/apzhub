    SupportArticle:
      type: object
      required:
        [
          id,
          supportTicketId,
          body,
          channel,
          visibility,
          senderType,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          pattern: "^sart_[0-9a-fA-F]{32}$"
          example: sart_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa5
        supportTicketId:
          type: string
          pattern: "^sreq_[0-9a-fA-F]{32}$"
        subject:
          type: string
        body:
          type: string
        bodyFormat:
          type: string
          enum: [text/plain, text/html, unknown]
        channel:
          type: string
          enum: [note, email, phone, web, chat, sms, fax, unknown]
        visibility:
          type: string
          enum: [internal, public]
          description: internal=note, public=reply
        senderType:
          type: string
          enum: [agent, customer, system, unknown]
        author:
          type: object
          properties:
            userId:
              type: string
            displayName:
              type: string
            email:
              type: string
            senderType:
              type: string
        recipients:
          type: object
          properties:
            to:
              type: array
              items:
                type: string
            cc:
              type: array
              items:
                type: string
            bcc:
              type: array
              items:
                type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateInternalNoteBody:
      type: object
      required: [body]
      additionalProperties: false
      description: >
        Internal note — visibility is always internal, channel is always note.
        Visibility field is not accepted (strict schema).
      properties:
        body:
          type: string
          minLength: 1
        bodyFormat:
          type: string
          enum: [text/plain, text/html, unknown]
        subject:
          type: string
          maxLength: 500

    CreateCustomerReplyBody:
      type: object
      required: [body]
      additionalProperties: false
      description: >
        Customer reply — visibility is always public.
        Channel must be a public channel (email, phone, web, chat, sms, fax).
        note and unknown channels are rejected.
      properties:
        body:
          type: string
          minLength: 1
        bodyFormat:
          type: string
          enum: [text/plain, text/html, unknown]
        subject:
          type: string
          maxLength: 500
        channel:
          type: string
          enum: [email, phone, web, chat, sms, fax]
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string


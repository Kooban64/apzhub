    CreateConfigurationRequest:
      type: object
      additionalProperties: false
      required:
        - namespaceKey
        - key
        - displayName
        - valueKind
        - hierarchyLevel
        - scope
      properties:
        namespaceKey: { type: string, minLength: 1, maxLength: 128 }
        namespaceName: { type: string, maxLength: 256 }
        groupKey: { type: string, maxLength: 128 }
        groupName: { type: string, maxLength: 256 }
        key: { type: string, minLength: 1, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 256 }
        description: { type: string, maxLength: 2000 }
        valueKind:
          type: string
          enum: [string, number, boolean, json, array, object, null]
        hierarchyLevel:
          type: string
          enum: [platform, tenant, organisation, product, environment, user]
        scope:
          $ref: "#/components/schemas/ConfigurationScopeBody"
        organisationId: { type: string, maxLength: 128 }
        inheritsFromConfigurationId: { type: string, maxLength: 128 }
    ValidateConfigurationMetadataRequest:
      type: object
      additionalProperties: false
      required: [hierarchyLevel, scope]
      properties:
        hierarchyLevel:
          type: string
          enum: [platform, tenant, organisation, product, environment, user]
        scope:
          $ref: "#/components/schemas/ConfigurationScopeBody"
        status:
          type: string
          enum: [draft, validated, approved, published, deprecated, archived]
        namespaceId: { type: string, maxLength: 128 }
        groupId: { type: string, maxLength: 128 }
        organisationId: { type: string, maxLength: 128 }
    ConfigurationScopeBody:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [global, tenant, organisation, product, environment, user]
        tenantId: { type: string, maxLength: 128 }
        organisationId: { type: string, maxLength: 128 }
        productId: { type: string, maxLength: 128 }
        environmentId: { type: string, maxLength: 128 }
        userId: { type: string, maxLength: 128 }
    CreateNotificationRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 512 }
        summary: { type: string, maxLength: 2000 }
        body: { type: string, maxLength: 10000 }
        key: { type: string, maxLength: 128 }
        priority:
          type: string
          enum: [critical, high, normal, low, informational]
        categoryId: { type: string, maxLength: 128 }
        templateId: { type: string, maxLength: 128 }
        channelKinds:
          type: array
          maxItems: 16
          items:
            type: string
            enum: [email, sms, push, in_app, webhook, microsoft_teams, slack, future]
        organisationId: { type: string, maxLength: 128 }
        expiresAt: { type: string, format: date-time }
        recipients:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [channelKind]
            properties:
              userId: { type: string, maxLength: 128 }
              addressHint: { type: string, maxLength: 256 }
              channelKind:
                type: string
                enum: [email, sms, push, in_app, webhook, microsoft_teams, slack, future]
        references:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [kind, resourceId]
            properties:
              kind:
                type: string
                enum: [projects, support, testing, reporting, documents, workflow, search, future]
              resourceId: { type: string, maxLength: 256 }
              label: { type: string, maxLength: 256 }
    UpdateNotificationRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 512 }
        summary: { type: string, nullable: true, maxLength: 2000 }
        body: { type: string, nullable: true, maxLength: 10000 }
        priority:
          type: string
          enum: [critical, high, normal, low, informational]
        categoryId: { type: string, nullable: true, maxLength: 128 }
        templateId: { type: string, nullable: true, maxLength: 128 }
        channelKinds:
          type: array
          maxItems: 16
          items:
            type: string
            enum: [email, sms, push, in_app, webhook, microsoft_teams, slack, future]
        expiresAt: { type: string, format: date-time, nullable: true }
    TransitionNotificationRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to:
          type: string
          enum: [draft, pending, queued, delivered, read, acknowledged, dismissed, expired, archived]
        reason: { type: string, maxLength: 512 }
    CreateNotificationTemplateRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 256 }

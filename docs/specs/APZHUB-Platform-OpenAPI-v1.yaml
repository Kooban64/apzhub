components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session cookie resolved server-side.
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Sort:
      name: sort
      in: query
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        pattern: "^ws_[0-9a-fA-F]{32}$"
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: "^proj_[0-9a-fA-F]{32}$"
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        pattern: "^task_[0-9a-fA-F]{32}$"
    SupportRequestId:
      name: supportRequestId
      in: path
      required: true
      schema:
        type: string
        pattern: "^sreq_[0-9a-fA-F]{32}$"
      example: sreq_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1
    ArticleId:
      name: articleId
      in: path
      required: true
      schema:
        type: string
        pattern: "^sart_[0-9a-fA-F]{32}$"
      example: sart_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa5
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^sorg_[0-9a-fA-F]{32}$"
      example: sorg_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa2
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        pattern: "^sgrp_[0-9a-fA-F]{32}$"
      example: sgrp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa3
    SupportUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        pattern: "^suser_[0-9a-fA-F]{32}$"
      example: suser_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa4
    TestingRequirementId:
      name: requirementId
      in: path
      required: true
      schema: &TestingIdSchema
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,127}$"
    TestingPlanId:
      name: planId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingSuiteId:
      name: suiteId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingCaseId:
      name: caseId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingExecutionId:
      name: executionId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingStepId:
      name: stepId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingEvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingImportId:
      name: importId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingCoverageId:
      name: coverageId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingDefectId:
      name: defectId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingCertificationId:
      name: certificationId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingApprovalId:
      name: approvalId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingRelationshipId:
      name: relationshipId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingReleaseId:
      name: releaseId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingResourcePathId:
      name: resourceId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingPipelineId:
      name: pipelineId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingPipelineRunId:
      name: runId
      in: path
      required: true
      schema: *TestingIdSchema
    TestingEngineeringSnapshotId:
      name: snapshotId
      in: path
      required: true
      schema: *TestingIdSchema
    PipelineOwner:
      name: owner
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$"
    PipelineRepo:
      name: repo
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$"
    PipelineWorkflowId:
      name: workflowId
      in: path
      required: true
      schema: *TestingIdSchema
    PipelineProviderRunId:
      name: runId
      in: path
      required: true
      schema: *TestingIdSchema
    PipelineJobId:
      name: jobId
      in: path
      required: true
      schema: *TestingIdSchema
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Permission or policy denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Mapping or revision conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Provider or dependency unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotImplemented:
      description: Capability not supported by provider
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected platform failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Meta:
      type: object
      required: [requestId, correlationId]
      properties:
        requestId:
          type: string
          format: uuid
        correlationId:
          type: string
    Page:
      type: object
      required: [cursor, nextCursor, limit, hasMore]
      properties:
        cursor:
          type: ["string", "null"]
        nextCursor:
          type: ["string", "null"]
        limit:
          type: integer
        hasMore:
          type: boolean
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
        meta:
          $ref: "#/components/schemas/Meta"
    TestingResource:
      type: object
      description: >
        Generic Testing Platform Service resource. Full domain contracts live in the
        Testing service SDK; this schema preserves OpenAPI coverage while avoiding
        backend-specific fields in the public workbench contract.
      additionalProperties: true
    TestingResourceInput:
      type: object

          newTickets,
          overdueTickets,
          unassignedTickets,
          byPriority,
          byState,
          byOrganization,
          byGroup,
          byOwner,
        ]
      description: >
        Intelligence snapshot. Not real-time. Fields may be omitted when the
        provider does not expose the underlying metric.
      properties:
        capturedAt:
          type: string
          format: date-time
        totalTickets:
          type: integer
        openTickets:
          type: integer
        closedTickets:
          type: integer
        pendingTickets:
          type: integer
        newTickets:
          type: integer
        overdueTickets:
          type: integer
        unassignedTickets:
          type: integer
        articleCount:
          type: integer
        byPriority:
          type: array
          items:
            $ref: "#/components/schemas/SupportDistributionBucket"
        byState:
          type: array
          items:
            $ref: "#/components/schemas/SupportDistributionBucket"
        byOrganization:
          type: array
          items:
            $ref: "#/components/schemas/SupportDistributionBucket"
        byGroup:
          type: array
          items:
            $ref: "#/components/schemas/SupportDistributionBucket"
        byOwner:
          type: array
          items:
            $ref: "#/components/schemas/SupportDistributionBucket"
        averageFirstResponseMinutes:
          type: number

    SupportDistributionBucket:
      type: object
      required: [key, count]
      properties:
        key:
          type: string
        label:
          type: string
        count:
          type: integer

    SupportSearchHit:
      type: object
      required: [id, kind, title]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [support_request, organization, group, user, article]
        title:
          type: string
        snippet:
          type: string
        score:
          type: number
        updatedAt:
          type: string
          format: date-time
        supportTicketId:
          type: string
          pattern: "^sreq_[0-9a-fA-F]{32}$"
        organizationId:
          type: string
          pattern: "^sorg_[0-9a-fA-F]{32}$"
        groupId:
          type: string
          pattern: "^sgrp_[0-9a-fA-F]{32}$"
        userId:
          type: string
          pattern: "^suser_[0-9a-fA-F]{32}$"
        articleId:
          type: string
          pattern: "^sart_[0-9a-fA-F]{32}$"

    SupportSearchResult:
      type: object
      required: [query, hits, totalCount, page, perPage, hasNextPage]
      properties:
        query:
          type: string
        hits:
          type: array
          items:
            $ref: "#/components/schemas/SupportSearchHit"
        totalCount:
          type: integer
        page:
          type: integer
        perPage:
          type: integer
        hasNextPage:
          type: boolean

    # Envelope wrappers for support domain
    SupportRequestSuccess:

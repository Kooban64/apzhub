  # ---------------------------------------------------------------------------
  # Support Search (OSS-110-11)
  # ---------------------------------------------------------------------------
  /support-search:
    get:
      operationId: supportSearch
      tags: [Support Search]
      summary: >
        Search across support tickets, organisations, groups, users, and articles.
        Requires q or query parameter.
      x-required-permission: support.search
      parameters:
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 500
        - name: query
          in: query
          description: Alias for q
          schema:
            type: string
            minLength: 1
            maxLength: 500
        - name: kinds
          in: query
          description: >
            Comma-separated kinds to restrict search.
            Allowed: support_request, organization, group, user, article
          schema:
            type: string
        - name: organizationId
          in: query
          schema:
            type: string
            pattern: "^sorg_[0-9a-fA-F]{32}$"
        - name: groupId
          in: query
          schema:
            type: string
            pattern: "^sgrp_[0-9a-fA-F]{32}$"
        - name: supportRequestId
          in: query
          schema:
            type: string
            pattern: "^sreq_[0-9a-fA-F]{32}$"
        - name: sort
          in: query
          schema:
            type: string
            enum: [score, updatedAt, title]
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Search result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSearchSuccess"
              examples:
                sample:
                  value:
                    data:
                      query: login
                      hits:
                        - id: sart_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa5
                          kind: article
                          title: Cannot login
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"


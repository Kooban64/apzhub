                    data:
                      capturedAt: "2026-07-10T00:00:00.000Z"
                      totalTickets: 100
                      openTickets: 42
                      closedTickets: 55
                      byPriority:
                        - key: high
                          count: 15
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"


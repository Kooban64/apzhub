manifestSchemaVersion: "1.0"
id: projects-task-status-changed
name: Projects Task Status Changed
version: 0.1.0
kind: event

metadata:
  category: productivity
  description: Emitted when an APZHUB Task status transitions.

event:
  category: business
  publisher: project-service
  subscribers:
    - search:projects.search
    - activity:projects.activity
    - notification:projects.task.status_changed
  payload:
    taskId: string
    projectId: string
    from: string
    to: string
    statusId: string

documentation:
  eventKey: projects.task.status_changed
  activityAction: projects.task.status_changed

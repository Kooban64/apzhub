# APZHUB host ports (R12-OPS-03 / ENVIRONMENT.md) — do not collide with legacy apz-stack:
# web 3300 · storybook 6006 · postgres 54334 · redis 6380 · caddy 3080/3443 · meilisearch 17700
# Forbidden examples: 54333 (apzpg), 8080 (nginx-gateway), 18081–18088 (engines)
services:
  postgres:
    image: postgres:16-alpine
    container_name: apzhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apzhub
      POSTGRES_PASSWORD: apzhub
      POSTGRES_DB: apzhub
    ports:
      - "54334:5432"
    volumes:
      - apzhub_postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apzhub -d apzhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: apzhub-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6380:6379"
    volumes:
      - apzhub_redis_data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: apzhub-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      # Prefer host env / `.secrets/meilisearch`; fallback is local-dev only.
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-apzhub-meili-dev-master-key-change-me}
    ports:
      - "17700:7700"
    volumes:
      - apzhub_meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: apzhub-caddy
    restart: unless-stopped
    ports:
      - "3080:80"
      - "3443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - apzhub_caddy_data:/data
      - apzhub_caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis

volumes:
  apzhub_postgres_data:
  apzhub_redis_data:
  apzhub_meilisearch_data:
  apzhub_caddy_data:
  apzhub_caddy_config:

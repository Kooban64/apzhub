# Production scaffold — SPR-001 (structure only, no deploy automation)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apzhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-apzhub}
    volumes:
      - apzhub_postgres_prod:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - apzhub_redis_prod:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - apzhub_caddy_prod:/data

volumes:
  apzhub_postgres_prod:
  apzhub_redis_prod:
  apzhub_caddy_prod:

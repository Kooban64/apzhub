# APZHUB-owned Metabase CE/LTS — isolated from legacy apz-metabase (18084).
# Project: apzhub-metabase-lts · publish 127.0.0.1:19084 only.

name: apzhub-metabase-lts

services:
  metabase-db:
    image: ${APZ_IMAGE_POSTGRES}
    container_name: apzhub-metabase-lts-db
    restart: unless-stopped
    networks: [metabase_lts_net]
    environment:
      POSTGRES_USER: ${METABASE_DB_USER:-metabase}
      POSTGRES_DB: ${METABASE_DB_NAME:-metabase}
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD}
    volumes:
      - metabase_lts_pg:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${METABASE_DB_USER:-metabase} -d ${METABASE_DB_NAME:-metabase}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  metabase:
    image: ${APZ_IMAGE_METABASE}
    container_name: apzhub-metabase-lts
    restart: unless-stopped
    networks: [metabase_lts_net]
    ports:
      - "127.0.0.1:${METABASE_PUBLISH_PORT:-19084}:3000"
    depends_on:
      metabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 180s
    environment:
      MB_SITE_URL: ${METABASE_SITE_URL:-http://127.0.0.1:19084}
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB_NAME:-metabase}
      MB_DB_PORT: "5432"
      MB_DB_USER: ${METABASE_DB_USER:-metabase}
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_HOST: metabase-db
      JAVA_TIMEZONE: ${TZ:-UTC}
      JAVA_OPTS: ${METABASE_JAVA_OPTS:--Xms512m -Xmx768m}

networks:
  metabase_lts_net:
    name: apzhub_metabase_lts_net
    driver: bridge

volumes:
  metabase_lts_pg:

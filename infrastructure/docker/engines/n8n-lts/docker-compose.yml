# APZHUB-owned n8n CE/LTS — isolated from legacy apz-n8n (15678).
# Project: apzhub-n8n-lts · publish 127.0.0.1:19678 only.
# Dedicated Postgres (do not use shared apzpg).

name: apzhub-n8n-lts

services:
  n8n-db:
    image: ${APZ_IMAGE_POSTGRES}
    container_name: apzhub-n8n-lts-db
    restart: unless-stopped
    networks: [n8n_lts_net]
    environment:
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - n8n_lts_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n} -d ${N8N_DB_NAME:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  n8n:
    image: ${APZ_IMAGE_N8N}
    container_name: apzhub-n8n-lts
    restart: unless-stopped
    networks: [n8n_lts_net]
    ports:
      - "127.0.0.1:${N8N_PUBLISH_PORT:-19678}:5678"
    depends_on:
      n8n-db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      N8N_HOST: ${N8N_HOST:-127.0.0.1}
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://127.0.0.1:19678/}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://127.0.0.1:19678/}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - n8n_lts_data:/home/node/.n8n
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:5678/healthz || wget -q -O /dev/null http://127.0.0.1:5678/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  n8n_lts_net:
    name: apzhub_n8n_lts_net
    driver: bridge

volumes:
  n8n_lts_pg:
  n8n_lts_data:

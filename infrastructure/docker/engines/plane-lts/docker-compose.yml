# APZHUB-owned Plane CE/LTS — isolated from legacy apz-plane-* (18085).
# Project: apzhub-plane-lts · publish 127.0.0.1:19085 only.
# Images: same digests as coexistence host pins (reuse local cache; no legacy mutation).

name: apzhub-plane-lts

x-db-env: &plane-db-env
  PGHOST: plane-db
  PGDATABASE: ${PLANE_POSTGRES_DB:-plane}
  POSTGRES_USER: ${PLANE_POSTGRES_USER:-plane}
  POSTGRES_PASSWORD: ${PLANE_POSTGRES_PASSWORD}
  POSTGRES_DB: ${PLANE_POSTGRES_DB:-plane}
  POSTGRES_PORT: 5432
  PGDATA: /var/lib/postgresql/data

x-redis-env: &plane-redis-env
  REDIS_HOST: plane-redis
  REDIS_PORT: 6379
  REDIS_URL: redis://plane-redis:6379/

x-minio-env: &plane-minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

x-aws-s3-env: &plane-aws-s3-env
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-proxy-env: &plane-proxy-env
  APP_DOMAIN: ${APP_DOMAIN:-localhost}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  CERT_EMAIL: ${CERT_EMAIL:-}
  CERT_ACME_DNS: ${CERT_ACME_DNS:-}
  LISTEN_HTTP_PORT: "80"
  LISTEN_HTTPS_PORT: "443"
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  SITE_ADDRESS: ${SITE_ADDRESS:-:80}

x-mq-env: &plane-mq-env
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: 5672
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}

x-live-env: &plane-live-env
  API_BASE_URL: http://api:8000
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}

x-app-env: &plane-app-env
  WEB_URL: ${WEB_URL:-http://127.0.0.1:19085}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:19085,http://localhost:19085}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
  USE_MINIO: "1"
  DATABASE_URL: postgresql://${PLANE_POSTGRES_USER:-plane}:${PLANE_POSTGRES_PASSWORD}@plane-db/${PLANE_POSTGRES_DB:-plane}
  SECRET_KEY: ${SECRET_KEY}
  AMQP_URL: amqp://${RABBITMQ_USER:-plane}:${RABBITMQ_PASSWORD}@plane-mq:5672/${RABBITMQ_VHOST:-plane}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: "0"
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}

services:
  plane-migrator:
    image: ${APZ_IMAGE_PLANE_BACKEND}
    container_name: apzhub-plane-lts-migrator
    restart: "no"
    networks: [plane_lts_net]
    command: ./bin/docker-entrypoint-migrator.sh
    volumes:
      - plane_lts_logs_migrator:/code/plane/logs
    environment:
      <<:
        [
          *plane-app-env,
          *plane-db-env,
          *plane-redis-env,
          *plane-minio-env,
          *plane-aws-s3-env,
          *plane-proxy-env,
        ]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_started

  plane-api:
    image: ${APZ_IMAGE_PLANE_BACKEND}
    container_name: apzhub-plane-lts-api
    restart: unless-stopped
    networks:
      plane_lts_net:
        aliases: [api]
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - plane_lts_logs_api:/code/plane/logs
    environment:
      <<:
        [
          *plane-app-env,
          *plane-db-env,
          *plane-redis-env,
          *plane-minio-env,
          *plane-aws-s3-env,
          *plane-proxy-env,
          *plane-mq-env,
        ]
    depends_on:
      plane-migrator:
        condition: service_completed_successfully
      plane-db:
        condition: service_started
      plane-redis:
        condition: service_started
      plane-mq:
        condition: service_started
      plane-minio:
        condition: service_started

  plane-worker:
    image: ${APZ_IMAGE_PLANE_BACKEND}
    container_name: apzhub-plane-lts-worker
    restart: unless-stopped
    networks: [plane_lts_net]
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - plane_lts_logs_worker:/code/plane/logs
    environment:
      <<:
        [
          *plane-app-env,
          *plane-db-env,
          *plane-redis-env,
          *plane-minio-env,
          *plane-aws-s3-env,
          *plane-proxy-env,
          *plane-mq-env,
        ]
    depends_on:
      plane-api:
        condition: service_started

  plane-beat-worker:
    image: ${APZ_IMAGE_PLANE_BACKEND}
    container_name: apzhub-plane-lts-beat
    restart: unless-stopped
    networks: [plane_lts_net]
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - plane_lts_logs_beat:/code/plane/logs
    environment:
      <<:
        [
          *plane-app-env,
          *plane-db-env,
          *plane-redis-env,
          *plane-minio-env,
          *plane-aws-s3-env,
          *plane-proxy-env,
          *plane-mq-env,
        ]
    depends_on:
      plane-api:
        condition: service_started

  plane-web:
    image: ${APZ_IMAGE_PLANE_FRONTEND}
    container_name: apzhub-plane-lts-web
    restart: unless-stopped
    networks:
      plane_lts_net:
        aliases: [web]
    depends_on:
      plane-api:
        condition: service_started

  plane-space:
    image: ${APZ_IMAGE_PLANE_SPACE}
    container_name: apzhub-plane-lts-space
    restart: unless-stopped
    healthcheck:
      disable: true
    networks:
      plane_lts_net:
        aliases: [space]
    depends_on:
      plane-api:
        condition: service_started
      plane-web:
        condition: service_started

  plane-admin:
    image: ${APZ_IMAGE_PLANE_ADMIN}
    container_name: apzhub-plane-lts-admin
    restart: unless-stopped
    networks:
      plane_lts_net:
        aliases: [admin]
    depends_on:
      plane-api:
        condition: service_started
      plane-web:
        condition: service_started

  plane-live:
    image: ${APZ_IMAGE_PLANE_LIVE}
    container_name: apzhub-plane-lts-live
    restart: unless-stopped
    networks:
      plane_lts_net:
        aliases: [live]
    environment:
      <<: [*plane-live-env, *plane-redis-env]
    depends_on:
      plane-api:
        condition: service_started

  plane-db:
    image: ${APZ_IMAGE_PLANE_POSTGRES}
    container_name: apzhub-plane-lts-db
    restart: unless-stopped
    networks: [plane_lts_net]
    command: postgres -c max_connections=1000
    environment:
      <<: *plane-db-env
    volumes:
      - plane_lts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PLANE_POSTGRES_USER:-plane} -d ${PLANE_POSTGRES_DB:-plane}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  plane-redis:
    image: ${APZ_IMAGE_VALKEY}
    container_name: apzhub-plane-lts-redis
    restart: unless-stopped
    networks: [plane_lts_net]
    volumes:
      - plane_lts_redisdata:/data

  plane-mq:
    image: ${APZ_IMAGE_RABBITMQ}
    container_name: apzhub-plane-lts-mq
    restart: unless-stopped
    networks: [plane_lts_net]
    environment:
      <<: *plane-mq-env
    volumes:
      - plane_lts_rabbitmq:/var/lib/rabbitmq

  plane-minio:
    image: ${APZ_IMAGE_MINIO}
    container_name: apzhub-plane-lts-minio
    restart: unless-stopped
    networks: [plane_lts_net]
    command: server /export --console-address ":9090"
    environment:
      <<: *plane-minio-env
    volumes:
      - plane_lts_uploads:/export

  plane-proxy:
    image: ${APZ_IMAGE_PLANE_PROXY}
    container_name: apzhub-plane-lts-proxy
    restart: unless-stopped
    networks: [plane_lts_net]
    ports:
      - "127.0.0.1:${PLANE_PUBLISH_HTTP_PORT:-19085}:80"
    environment:
      <<: *plane-proxy-env
    volumes:
      - plane_lts_proxy_config:/config
      - plane_lts_proxy_data:/data
    depends_on:
      plane-web:
        condition: service_started
      plane-api:
        condition: service_started
      plane-space:
        condition: service_started
      plane-admin:
        condition: service_started
      plane-live:
        condition: service_started

networks:
  plane_lts_net:
    name: apzhub_plane_lts_net
    driver: bridge

volumes:
  plane_lts_pgdata:
  plane_lts_redisdata:
  plane_lts_uploads:
  plane_lts_logs_api:
  plane_lts_logs_worker:
  plane_lts_logs_beat:
  plane_lts_logs_migrator:
  plane_lts_rabbitmq:
  plane_lts_proxy_config:
  plane_lts_proxy_data:

manifestSchemaVersion: "1.0"
id: n8n
name: n8n Workflow Engine Integration
version: 0.1.0
kind: integration

metadata:
  category: integrations
  description: >-
    n8n Integration Foundation (APZHUB-INTEGRATION-N8N-001). Read-only Workflow Engine
    Reference Adapter via Integration SDK. Metadata discovery only. Not user-facing.
    Not a Platform Service.
  owner: APZHUB
  tags:
    - n8n
    - workflow
    - workflow-engine
    - adapter
    - reference
    - foundation

dependencies:
  platform: []

integration:
  type: oss-application
  capabilities:
    - health
    - authentication-bridge
    - error-translation
    - diagnostics
    - workflows
    - workflow-templates
    - credentials-metadata
    - variables-metadata
    - executions-metadata
    - tags
    - users
    - projects
    - version
    - compatibility

health:
  enabled: true

documentation:
  userVisible: false
  engineBranding: hidden
  # Manifest documentation is z.record(string|boolean|number) — use singular string (see metabase).
  supportedApiVersion: "v1"
  supportedEngineVersionMin: "n8n 1.0.0"
  supportedEngineVersionMax: "n8n 1.x"
  adapterImplementation: APZHUB-INTEGRATION-N8N-001
  priorWave: APZWORKFLOW-006

tests:
  contract: present
  integration: planned

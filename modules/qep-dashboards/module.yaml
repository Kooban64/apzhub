manifestSchemaVersion: "1.0"
id: qep-dashboards
name: Enterprise Dashboards
version: 0.1.0
kind: module

metadata:
  category: quality-engineering
  description: >
    Enterprise Dashboard & Quality Experience workspace (APZQEP-164).
    Consumes @apzhub/platform-dashboard and @apzhub/platform-visualization.
    No business logic; projections only.
  product: apzqep
  slug: dashboards
  programme: APZQEP-164

dependencies:
  platform: []
  services:
    - qep-platform-service

module:
  category: quality-engineering
  status: active

workbench:
  navigation:
    level: sidebar
    workspace: qep
    parent: qep
    label: Dashboards
    icon: layout-dashboard
    route: /workspace/qep/dashboards
    order: 70
    permission: qep.dashboards.read
  view:
    title: Enterprise Dashboard & Quality Experience
    workspace: qep
    route: /workspace/qep/dashboards
    permission: qep.dashboards.read

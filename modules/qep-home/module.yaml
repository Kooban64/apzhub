manifestSchemaVersion: "1.0"
id: qep-home
name: Home and Command Centre
version: 0.2.0
kind: module

metadata:
  category: quality-engineering
  description: >
    Release Control entry surface for APZQEP (SPR-APZQEP-201). Answers
    "Can we release with confidence?" over live Quality Flow posture.
  product: apzqep
  moduleCatalogueId: M01
  slug: home
  programme: SPR-APZQEP-201

dependencies:
  platform: []
  services:
    - qep-platform-service

module:
  category: quality-engineering
  status: active

permissions:
  - id: qep.home.read
    label: View Home and Command Centre

workbench:
  navigation:
    level: sidebar
    workspace: qep
    parent: qep
    label: Home
    icon: layout-dashboard
    route: /workspace/qep/home
    order: 1
    permission: qep.home.read
  view:
    title: Home and Command Centre
    workspace: qep
    route: /workspace/qep/home
    permission: qep.home.read

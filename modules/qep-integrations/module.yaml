manifestSchemaVersion: "1.0"
id: qep-integrations
name: Integration Centre
version: 0.3.0
kind: module

metadata:
  category: quality-engineering
  description: >
    Integration Centre (SPR-APZQEP-220-D). Lists automation and SCM providers
    plus Playwright runner health, with enable/disable and last-sync ledger
    (platform metadata only — not Cap connector SoR).
  product: apzqep
  slug: integrations
  programme: SPR-APZQEP-220

dependencies:
  platform: []
  services:
    - qep-platform-service

module:
  category: quality-engineering
  status: active

permissions:
  - id: qep.integrations.read
    label: View Integration Centre
  - id: qep.integrations.operate
    label: Operate Integration Centre connectors

workbench:
  navigation:
    level: sidebar
    workspace: qep
    parent: qep
    label: Integration Centre
    icon: plug
    route: /workspace/qep/integrations
    order: 15
    permission: qep.integrations.read
  view:
    title: Integration Centre
    workspace: qep
    route: /workspace/qep/integrations
    permission: qep.integrations.read

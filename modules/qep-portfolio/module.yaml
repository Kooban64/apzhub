manifestSchemaVersion: "1.0"
id: qep-portfolio
name: Applications
version: 0.3.0
kind: module

metadata:
  category: quality-engineering
  description: >
    APZQEP Applications registry — durable Application aggregate, environments,
    execution targets, and SCM repository association. Does not grant Source
    access. Does not execute SSH.
  product: apzqep
  moduleCatalogueId: M02
  slug: applications
  programme: PHASE-1E

dependencies:
  platform: []
  services:
    - qep-application

module:
  category: quality-engineering
  status: active

permissions:
  - id: qep.portfolio.read
    description: View applications and application setup
  - id: qep.portfolio.operate
    description: Register applications and configure repositories, environments, and execution targets

workbench:
  navigation:
    level: sidebar
    workspace: qep
    parent: qep
    label: Applications
    icon: app-window
    route: /workspace/qep/applications
    order: 20
    permission: qep.portfolio.read
  view:
    title: Applications
    workspace: qep
    route: /workspace/qep/applications
    permission: qep.portfolio.read

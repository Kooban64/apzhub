manifestSchemaVersion: "1.0"
id: qep-quality-intelligence
name: Enterprise Quality Intelligence
version: 0.1.0
kind: module

metadata:
  category: quality-engineering
  description: >
    Enterprise Quality Intelligence Platform workspace (APZQEP-163).
    Provider-neutral intelligence with rules, statistical, historical and
    offline dummy AI providers. No external AI APIs.
  product: apzqep
  slug: quality-intelligence
  programme: APZQEP-163

dependencies:
  platform: []
  services:
    - qep-platform-service

module:
  category: quality-engineering
  status: active

permissions:
  - id: qep.qi.read
    label: View Quality Intelligence
  - id: qep.qi.operate
    label: Operate Quality Intelligence

workbench:
  navigation:
    level: sidebar
    workspace: qep
    parent: qep
    label: Quality Intelligence
    icon: brain
    route: /workspace/qep/quality-intelligence
    order: 72
    permission: qep.qi.read
  view:
    title: Enterprise Quality Intelligence
    workspace: qep
    route: /workspace/qep/quality-intelligence
    permission: qep.qi.read

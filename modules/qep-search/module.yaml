manifestSchemaVersion: "1.0"
id: qep-search
name: Search and Navigation
version: 0.2.0
kind: module

metadata:
  category: quality-engineering
  description: "Permission-filtered QEP entity search over the Platform Search API (SPR-APZQEP-204)."
  product: apzqep
  moduleCatalogueId: M22
  slug: search

dependencies:
  platform: []
  services:
    - qep-platform-service

module:
  category: quality-engineering
  status: active

permissions:
  - id: qep.search.read
    label: Search QEP entities

workbench:
  navigation:
    level: sidebar
    workspace: qep
    parent: qep
    label: Search
    icon: search
    route: /workspace/qep/search
    order: 220
    permission: qep.search.read
  view:
    title: QEP Search
    workspace: qep
    route: /workspace/qep/search
    permission: qep.search.read

    order: 100
    permission: qep.execution.read
  view:
    title: Test Execution
    workspace: qep
    route: /workspace/qep/test-execution
    permission: qep.execution.read
  additionalViews:
    - id: qep-test-execution-explorer
      title: Explorer
      workspace: qep
      route: /workspace/qep/test-execution/explorer
      permission: qep.execution.read
      navigation:
        level: sidebar
        parent: qep-test-execution
        label: Explorer
        icon: list
        order: 101
        permission: qep.execution.read
    - id: qep-test-execution-assigned
      title: Assigned
      workspace: qep
      route: /workspace/qep/test-execution/assigned
      permission: qep.execution.read
      navigation:
        level: sidebar
        parent: qep-test-execution
        label: Assigned
        icon: user-check
        order: 102
        permission: qep.execution.read
    - id: qep-test-execution-review
      title: Review
      workspace: qep
      route: /workspace/qep/test-execution/review
      permission: qep.execution.review
      navigation:
        level: sidebar
        parent: qep-test-execution
        label: Review
        icon: clipboard-check
        order: 103

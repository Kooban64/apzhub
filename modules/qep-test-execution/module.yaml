  status: workbench-implemented

permissions:
  - id: qep.execution.read
    label: View Test Executions
  - id: qep.execution.create
    label: Create Test Executions
  - id: qep.execution.prepare
    label: Prepare Test Executions
  - id: qep.execution.assign
    label: Assign Test Executions
  - id: qep.execution.execute
    label: Execute Test Executions
  - id: qep.execution.control
    label: Control Test Executions
  - id: qep.execution.review
    label: Review Test Executions
  - id: qep.execution.supersede
    label: Supersede Test Executions
  - id: qep.execution.ingest
    label: Ingest External Test Execution Results
  - id: qep.execution.admin
    label: Administer Test Executions

workbench:
  navigation:

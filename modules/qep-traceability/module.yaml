    label: Modify Trace Links
  - id: qep.traceability.trace_links.validate
    label: Validate Trace Links
  - id: qep.traceability.trace_links.approve
    label: Approve Trace Links
  - id: qep.traceability.trace_links.retire
    label: Retire Trace Links
  - id: qep.traceability.trace_links.supersede
    label: Supersede Trace Links

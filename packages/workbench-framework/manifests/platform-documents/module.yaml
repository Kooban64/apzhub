manifestSchemaVersion: "1.0"
id: platform-documents
name: Documents
version: 0.1.0
kind: module

metadata:
  category: platform
  description: APZ Documents — work companion for enterprise documents.

dependencies:
  platform: []

module:
  category: platform

workbench:
  navigation:
    level: activity-bar
    workspace: documents
    icon: file-text
    route: /workspace/documents
    order: 50
    permission: document.read
  view:
    title: APZ Documents
    workspace: documents
    route: /workspace/documents
    default: true
    permission: document.read
  actions:
    - id: platform.documents.navigate
      label: Go to APZ Documents
      handler: workbench-bridge:workbench.navigation.reveal
      permission: document.read
      palette: true
      group: Navigation
      icon: file-text
      order: 50
      description: Reveal APZ Documents in the workbench shell.

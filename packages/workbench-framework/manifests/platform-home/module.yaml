manifestSchemaVersion: "1.0"
id: platform-home
name: My Work
version: 0.2.0
kind: module

metadata:
  category: platform
  description: >
    Unified Work Experience Composition Layer landing surface
    (APZHUB-CAPABILITY-001-ENG-001). Route remains /workspace/home.

dependencies:
  platform: []

module:
  category: platform

workbench:
  navigation:
    level: activity-bar
    workspace: home
    icon: home
    route: /workspace/home
    order: 10
    permission: platform.nav.home.view
  view:
    title: My Work
    workspace: home
    route: /workspace/home
    default: true
    permission: platform.nav.home.view
  actions:
    - id: platform.home.navigate
      label: Go to My Work
      handler: workbench-bridge:workbench.navigation.reveal
      permission: platform.nav.home.view
      shortcut: Ctrl+Shift+H
      palette: true
      group: Navigation
      icon: home
      order: 5
      description: Reveal My Work — the portfolio work queue — in the workbench shell.

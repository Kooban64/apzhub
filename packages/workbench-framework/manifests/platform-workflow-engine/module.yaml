manifestSchemaVersion: "1.0"
id: platform-workflow-engine
name: Operator tools
version: 0.1.0
kind: module

metadata:
  category: platform
  description: APZ Workflow operator tools (secondary — N-03; never primary product identity).

dependencies:
  platform: []

module:
  category: platform

workbench:
  navigation:
    level: sidebar
    workspace: workflow
    parent: workflow
    label: Operator tools
    icon: circuit-board
    route: /workspace/workflow-engine
    order: 200
    permission: workflow.admin
  view:
    title: Operator tools
    workspace: workflow-engine
    route: /workspace/workflow-engine
    default: true
    permission: workflow.admin
  actions:
    - id: platform.workflow-engine.navigate
      label: Open Operator tools
      handler: workbench-bridge:workbench.navigation.reveal
      permission: workflow.admin
      palette: true
      group: APZ Workflow Operator
      icon: circuit-board
      order: 53
      description: Open APZ Workflow operator tools (authorised operators only).
    - id: platform.workflow-engine.refresh
      label: Refresh Operator tools
      handler: workbench-bridge:workbench.view.refresh
      permission: workflow.admin
      palette: true
      group: APZ Workflow Operator
      icon: refresh-cw
      order: 10
      description: Refresh operator tools data.
    - id: platform.workflow-engine.validate
      label: Validate operator connection
      handler: workbench-bridge:workbench.view.refresh
      permission: workflow.admin
      palette: true
      group: APZ Workflow Operator
      icon: shield-check
      order: 20
      description: Validate operator connection (read-only).

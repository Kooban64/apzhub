manifestSchemaVersion: "1.0"
id: platform-workflows
name: Workflows
version: 0.1.0
kind: module

metadata:
  category: platform
  description: Platform Workflows workspace — metadata workbench (APZWORKFLOW-004).

dependencies:
  platform: []

module:
  category: platform

workbench:
  navigation:
    level: activity-bar
    workspace: workflows
    icon: git-branch
    route: /workspace/workflows
    order: 52
    permission: workflow.view
  view:
    title: Workflows
    workspace: workflows
    route: /workspace/workflows
    default: true
    permission: workflow.view
  actions:
    - id: platform.workflows.navigate
      label: Go to Workflows
      handler: workbench-bridge:workbench.navigation.reveal
      permission: workflow.view
      palette: true
      group: Navigation
      icon: git-branch
      order: 52
      description: Reveal the Workflows navigation item in the workbench shell.

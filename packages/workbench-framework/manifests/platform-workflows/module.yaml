manifestSchemaVersion: "1.0"
id: platform-workflows
name: Process library
version: 0.1.0
kind: module

metadata:
  category: platform
  description: APZ Workflow process library (secondary SoR plane — N-03 converged under APZ Workflow).

dependencies:
  platform: []

module:
  category: platform

workbench:
  navigation:
    level: sidebar
    workspace: workflow
    parent: workflow
    label: Process library
    icon: git-branch
    route: /workspace/workflows
    order: 15
    permission: workflow.view
  view:
    title: Process library
    workspace: workflows
    route: /workspace/workflows
    default: true
    permission: workflow.view
  actions:
    - id: platform.workflows.navigate
      label: Open Process library
      handler: workbench-bridge:workbench.navigation.reveal
      permission: workflow.view
      palette: true
      group: APZ Workflow
      icon: git-branch
      order: 52
      description: Open the APZ Workflow process library.

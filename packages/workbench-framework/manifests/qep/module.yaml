manifestSchemaVersion: "1.0"
id: qep
name: Quality
version: 0.2.0
kind: module

metadata:
  category: quality-engineering
  description: >
    APZQEP Quality activity-bar workspace root. Child modules register under
    parent qep. Entry surface is Home / Release Control (SPR-APZQEP-201);
    Quality Flow Workspace remains the operational engine face.
  product: apzqep

dependencies:
  platform: []

module:
  category: quality-engineering
  status: active

workbench:
  navigation:
    level: activity-bar
    workspace: qep
    label: Quality
    icon: flask-conical
    route: /workspace/qep/home
    order: 35
    permission: qep.home.read
  view:
    title: Quality
    workspace: qep
    route: /workspace/qep/home
    default: true
    permission: qep.home.read

manifestSchemaVersion: "1.0"
id: analytics
name: APZ Analytics
version: 0.1.0
kind: module

metadata:
  category: analytics
  description: >
    APZ Analytics — Decision Companion (APZ-ANALYTICS-NATIVE-001-N03).
    Users enter through business questions and leave with decisions.
    Presentation over Analytics HTTP API `/api/v1/analytics/*` only.
  owner: APZHUB
  icon: chart-column
  tags:
    - analytics
    - decisions
    - insights
    - questions
    - workbench

dependencies:
  platform: []
  services:
    - analytics-service

compatibility:
  platformVersion: ">=0.1.0"

module:
  category: analytics
  status: enabled
  description: >
    APZ Analytics Decision Companion — Question → Insight → Decision.

permissions:
  - id: analytics.view
    description: Enter APZ Analytics — view authorised questions, insights, and decision surfaces.
  - id: analytics.manage
    description: Manage saved insight views and share/embed controls.
  - id: analytics.admin
    description: Administer Analytics operator surfaces and presentation assets.
  - id: analytics.dashboard.view
    description: View curated insight answers (presentation layer).
  - id: analytics.dataset.view
    description: View presentation data assets (operator / elevated).
  - id: analytics.kpi.view
    description: View operational health indicators.
  - id: analytics.report.run
    description: View presentation report links (operator / elevated).
  - id: analytics.saved.manage
    description: Manage saved insight views.
  - id: analytics.dashboard.share
    description: Share insight answers.
  - id: analytics.dashboard.embed
    description: Embed insight answers.

navigation:
  activityBar:
    enabled: true
    label: APZ Analytics
    icon: chart-column
    order: 28
    permission: analytics.view
  sidebar:
    - id: analytics.home
      label: Home
      route: /workspace/analytics
      icon: layout-dashboard
      permission: analytics.view
    - id: analytics.questions
      label: Questions
      route: /workspace/analytics/questions
      icon: circle-help
      permission: analytics.view
    - id: analytics.horizon.operational
      label: Operational
      route: /workspace/analytics/horizons/operational
      icon: activity
      permission: analytics.view
    - id: analytics.horizon.tactical
      label: Tactical
      route: /workspace/analytics/horizons/tactical
      icon: trending-up
      permission: analytics.view
    - id: analytics.horizon.strategic
      label: Strategic
      route: /workspace/analytics/horizons/strategic
      icon: compass
      permission: analytics.view
    - id: analytics.saved
      label: Saved insights
      route: /workspace/analytics/saved
      icon: bookmark
      permission: analytics.saved.manage
    - id: analytics.search
      label: Find an insight
      route: /workspace/analytics/search
      icon: search
      permission: analytics.view
    - id: analytics.help
      label: Help
      route: /workspace/analytics/help
      icon: life-buoy
      permission: analytics.view
    - id: analytics.settings
      label: Settings
      route: /workspace/analytics/settings
      icon: settings
      permission: analytics.view
    - id: analytics.datasets
      label: Datasets
      route: /workspace/analytics/datasets
      icon: database
      permission: analytics.admin
    - id: analytics.reports
      label: Reports
      route: /workspace/analytics/reports
      icon: file-bar-chart
      permission: analytics.admin
    - id: analytics.health
      label: Health
      route: /workspace/analytics/health
      icon: heart-pulse
      permission: analytics.admin
    - id: analytics.diagnostics
      label: Diagnostics
      route: /workspace/analytics/diagnostics
      icon: stethoscope
      permission: analytics.admin

commands:
  - id: analytics.home.open
    label: Open APZ Analytics
    category: APZ Analytics
    permission: analytics.view
  - id: analytics.questions.open
    label: What should I know before I act?
    category: APZ Analytics
    permission: analytics.view
  - id: analytics.saved.open
    label: Open Saved Insights
    category: APZ Analytics
    permission: analytics.saved.manage
  - id: analytics.search.open
    label: Find an Insight
    category: APZ Analytics
    permission: analytics.view
  - id: analytics.help.open
    label: Open Analytics Help
    category: APZ Analytics
    permission: analytics.view
  - id: analytics.health.open
    label: Open Analytics Operator Health
    category: APZ Analytics
    permission: analytics.admin

workbench:
  navigation:
    level: activity-bar
    workspace: analytics
    label: APZ Analytics
    icon: chart-column
    route: /workspace/analytics
    order: 28
    permission: analytics.view
  view:
    title: APZ Analytics
    workspace: analytics
    route: /workspace/analytics
    default: true
    permission: analytics.view
  actions:
    - id: analytics.home.open
      label: Open APZ Analytics
      handler: workbench-bridge:workbench.navigation.reveal
      permission: analytics.view
      palette: true
      group: APZ Analytics
      icon: layout-dashboard
      order: 10
      description: Enter the Decision Companion through questions and decisions.
    - id: analytics.questions.open
      label: What should I know before I act?
      handler: workbench-bridge:workbench.navigation.reveal
      permission: analytics.view
      palette: true
      group: APZ Analytics
      icon: circle-help
      order: 20
      description: Open the Enterprise Question Catalogue.
    - id: analytics.saved.open
      label: Open Saved Insights
      handler: workbench-bridge:workbench.navigation.reveal
      permission: analytics.saved.manage
      palette: true
      group: APZ Analytics
      icon: bookmark
      order: 30
      description: Open saved insight views.
    - id: analytics.search.open
      label: Find an Insight
      handler: workbench-bridge:workbench.navigation.reveal
      permission: analytics.view
      palette: true
      group: APZ Analytics
      icon: search
      order: 40
      description: Search curated insight answers.
    - id: analytics.help.open
      label: Open Analytics Help
      handler: workbench-bridge:workbench.navigation.reveal
      permission: analytics.view
      palette: true
      group: APZ Analytics
      icon: life-buoy
      order: 45
      description: Open Decision Companion help.
    - id: analytics.health.open
      label: Open Analytics Operator Health
      handler: workbench-bridge:workbench.navigation.reveal
      permission: analytics.admin
      palette: true
      group: APZ Analytics
      icon: activity
      order: 50
      description: Open Analytics operator health (admin).

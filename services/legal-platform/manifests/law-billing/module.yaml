manifestSchemaVersion: "1.0"
id: legal-billing
name: Billing
version: 1.0.0
kind: module

metadata:
  category: legal
  description: Billing UX validation module for the APZHUB Law Platform.

dependencies:
  platform: []

module:
  category: legal

workbench:
  navigation:
    level: sidebar
    workspace: law
    parent: legal-platform-root
    label: Billing
    icon: receipt
    route: /workspace/law/billing
    order: 80
    permission: law.admin
  view:
    title: Billing
    workspace: law
    route: /workspace/law/billing
    permission: law.admin
  actions:
    - id: legal.open.billing
      label: Open Billing
      handler: workbench-bridge:workbench.view.open
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: receipt
      order: 80
      description: Navigate to the Billing module.
    - id: legal.invoice.open
      label: Open Invoice
      handler: service:legal-billing:open
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: receipt
      order: 81
      description: Open an invoice from the register.
    - id: legal.invoice.create
      label: Create Invoice
      handler: service:legal-billing:create
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: plus
      order: 82
      description: Open the create invoice form.
    - id: legal.invoice.edit
      label: Edit Invoice
      handler: service:legal-billing:edit
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: edit
      order: 83
      description: Open the edit invoice form.
    - id: legal.invoice.cancel
      label: Cancel Invoice
      handler: service:legal-billing:cancel
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: x
      order: 84
      description: Void an invoice in the in-memory repository.
    - id: legal.invoice.mark-paid
      label: Mark Invoice Paid
      handler: service:legal-billing:mark-paid
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: check
      order: 85
      description: Mark an invoice as paid in memory only.
    - id: legal.invoice.search
      label: Search Invoices
      handler: service:legal-billing:search
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: search
      order: 86
      description: Focus invoice search in the list.

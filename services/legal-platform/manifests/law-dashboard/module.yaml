manifestSchemaVersion: "1.0"
id: legal-dashboard
name: Firm overview
version: 1.0.0
kind: module

metadata:
  category: legal
  description: >
    Practice firm overview — secondary, role-gated administration surface.
    Does not define the Governance Companion experience (N-03).

dependencies:
  platform: []

module:
  category: legal

workbench:
  navigation:
    level: sidebar
    workspace: law
    parent: legal-platform-root
    label: Firm overview
    icon: layout-dashboard
    route: /workspace/law/dashboard
    order: 100
    permission: law.admin
  view:
    title: Firm overview
    workspace: law
    route: /workspace/law/dashboard
    permission: law.admin
  actions:
    - id: legal.open.dashboard
      label: Open firm overview
      handler: workbench-bridge:workbench.view.open
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: layout-dashboard
      order: 100
      description: Open practice firm overview (secondary administration).

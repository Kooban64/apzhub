manifestSchemaVersion: "1.0"
id: legal-reports
name: Reports
version: 1.0.0
kind: module

metadata:
  category: legal
  description: Reports placeholder module for the APZHUB Law Platform.

dependencies:
  platform: []

module:
  category: legal

workbench:
  navigation:
    level: sidebar
    workspace: law
    parent: legal-platform-root
    label: Reports
    icon: bar-chart
    route: /workspace/law/reports
    order: 90
    permission: law.admin
  view:
    title: Reports
    workspace: law
    route: /workspace/law/reports
    permission: law.admin
  actions:
    - id: legal.open.reports
      label: Open Reports
      handler: workbench-bridge:workbench.view.open
      permission: law.admin
      palette: true
      group: APZ Law
      icon: bar-chart
      order: 90
      description: Navigate to the Reports module.

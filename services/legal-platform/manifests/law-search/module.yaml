manifestSchemaVersion: "1.0"
id: legal-search
name: Search
version: 1.0.0
kind: module

metadata:
  category: legal
  description: >
    Practice unified search across clients, matters, documents, and related
    records — secondary, role-gated (N-03 administrative separation).

dependencies:
  platform: []

module:
  category: legal

workbench:
  navigation:
    level: sidebar
    workspace: law
    parent: legal-platform-root
    label: Search
    icon: search
    route: /workspace/law/search
    order: 110
    permission: law.admin
  view:
    title: Search
    workspace: law
    route: /workspace/law/search
    permission: law.admin
  actions:
    - id: legal.open.search
      label: Open Search
      handler: workbench-bridge:workbench.view.open
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: search
      order: 110
      description: Navigate to practice Legal Search.
    - id: legal.search.open
      label: Open Legal Search
      handler: service:legal-search:open
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: search
      order: 111
      description: Open the unified Legal Search page.
    - id: legal.search.execute
      label: Execute Legal Search
      handler: service:legal-search:execute
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: search
      order: 112
      description: Run unified search and navigate to results.

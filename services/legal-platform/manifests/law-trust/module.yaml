manifestSchemaVersion: "1.0"
id: legal-trust
name: Trust Accounting
version: 1.0.0
kind: module

metadata:
  category: legal
  description: Trust Accounting workbench for regulated client funds — in-memory engine UI (LAW-015-09).

dependencies:
  platform: []

module:
  category: legal

workbench:
  navigation:
    level: sidebar
    workspace: law
    parent: legal-platform-root
    label: Trust
    icon: vault
    route: /workspace/law/trust
    order: 75
    permission: law.admin
  view:
    title: Trust Accounting
    workspace: law
    route: /workspace/law/trust
    permission: law.admin
  actions:
    - id: legal.open.trust
      label: Open Trust Accounting
      handler: workbench-bridge:workbench.view.open
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: vault
      order: 75
      description: Navigate to the Trust Accounting dashboard.
    - id: legal.trust.open
      label: Open Trust Dashboard
      handler: service:legal-trust:open
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: vault
      order: 76
      description: Open the trust dashboard.
    - id: legal.trust.transactions.open
      label: Open Trust Transactions
      handler: service:legal-trust:open-transactions
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: list
      order: 77
      description: Open the trust transactions view.
    - id: legal.trust.reconciliation.open
      label: Open Trust Reconciliation
      handler: service:legal-trust:open-reconciliation
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: scale
      order: 78
      description: Open the trust reconciliation view.
    - id: legal.trust.reports.open
      label: Open Trust Reports
      handler: service:legal-trust:open-reports
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: file-text
      order: 79
      description: Open the trust reports view.
    - id: legal.trust.transfer.create
      label: Create Trust Transfer
      handler: service:legal-trust:create-transfer
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: arrow-left-right
      order: 80
      description: Navigate to trust transfers to create a transfer draft.
    - id: legal.trust.interest.run
      label: Run Trust Interest
      handler: service:legal-trust:run-interest
      permission: law.admin
      palette: true
      group: APZ Law Practice
      icon: percent
      order: 81
      description: Navigate to trust interest accrual and posting.

manifestSchemaVersion: "1.0"
id: projects
name: APZ Projects
version: 0.1.0
kind: module

metadata:
  category: productivity
  description: APZ Projects — plan, coordinate, execute, and deliver work inside APZHUB.
  owner: APZHUB
  icon: folder-kanban
  tags:
    - projects
    - tasks
    - sprints
    - backlog
    - roadmap

dependencies:
  platform: []
  services:
    - project-service

compatibility:
  platformVersion: ">=0.1.0"

module:
  category: productivity
  status: enabled
  description: APZ Projects native workspace module.

permissions:
  - id: projects.view
    description: View projects workspace and project list.
  - id: projects.manage
    description: Create and update projects.
  - id: projects.task.view
    description: View tasks, backlog, and board.
  - id: projects.task.manage
    description: Create, update, assign, and transition tasks.
  - id: projects.sprint.view
    description: View sprints and sprint board.
  - id: projects.sprint.manage
    description: Create, start, and complete sprints.
  - id: projects.admin
    description: Administer project settings, team, and archive projects.

navigation:
  activityBar:
    enabled: true
    label: Projects
    icon: folder-kanban
    order: 20
    permission: projects.view
  # Primary (W002 D18): Operational Workspace + Search; All Projects secondary.
  # Entity tools (tasks/backlog/sprints/roadmap/my-work) are demoted — use Cockpit More….
  sidebar:
    - id: projects.dashboard
      label: Operational Workspace
      route: /workspace/projects
      icon: layout-dashboard
      permission: projects.view
    - id: projects.portfolio
      label: Portfolio
      route: /workspace/projects/portfolio
      icon: layers
      permission: projects.view
    - id: projects.reviews
      label: Reviews
      route: /workspace/projects/reviews
      icon: clipboard-check
      permission: projects.view
    - id: projects.reports
      label: Reports
      route: /workspace/projects/reports
      icon: file-bar-chart
      permission: projects.view
    - id: projects.portfolio-admin
      label: Portfolio Admin
      route: /workspace/projects/portfolio/admin
      icon: settings-2
      permission: projects.manage
    - id: projects.teams
      label: Teams
      route: /workspace/projects/teams
      icon: users
      permission: projects.view
    - id: projects.admin
      label: Administration
      route: /workspace/projects/admin
      icon: shield
      permission: projects.admin
    - id: projects.search
      label: Search
      route: /workspace/projects/search
      icon: search
      permission: projects.view
    - id: projects.productivity
      label: Productivity
      route: /workspace/projects/productivity
      icon: zap
      permission: projects.view
    - id: projects.list
      label: All Projects
      route: /workspace/projects/list
      icon: folder
      permission: projects.view
    - id: projects.help
      label: Help
      route: /workspace/projects/help
      icon: circle-help
      permission: projects.view
    - id: projects.settings
      label: Settings
      route: /workspace/projects/settings
      icon: settings
      permission: projects.view
    - id: projects.my-work
      label: My Work
      route: /workspace/projects/my-work
      icon: user
      permission: projects.task.view
    - id: projects.tasks
      label: Tasks
      route: /workspace/projects/tasks
      icon: check-square
      permission: projects.task.view
    - id: projects.backlog
      label: Backlog
      route: /workspace/projects/backlog
      icon: list
      permission: projects.task.view
    - id: projects.sprints
      label: Sprints
      route: /workspace/projects/sprints
      icon: calendar
      permission: projects.sprint.view
    - id: projects.roadmap
      label: Roadmap
      route: /workspace/projects/roadmap
      icon: map
      permission: projects.view
    - id: projects.health
      label: Readiness
      route: /workspace/projects/health
      icon: activity
      permission: projects.admin

commands:
  - id: projects.goto.workspace
    label: Go to Operational Workspace
    category: Projects
    permission: projects.view
  - id: projects.goto.portfolio
    label: Open Portfolio Scorecard
    category: Projects
    permission: projects.view
  - id: projects.goto.queue
    label: Open Focus Queue
    category: Projects
    permission: projects.view
  - id: projects.goto.search
    label: Open Search
    category: Projects
    permission: projects.view
  - id: projects.goto.reviews
    label: Open Review Calendar
    category: Projects
    permission: projects.view
  - id: projects.goto.reports
    label: Open Reports Catalogue
    category: Projects
    permission: projects.view
  - id: projects.goto.productivity
    label: Open Productivity
    category: Projects
    permission: projects.view
  - id: projects.quick-action
    label: Quick Action…
    category: Projects
    permission: projects.view
  - id: projects.create.commitment
    label: New commitment (current project)
    category: Projects
    permission: projects.manage
  - id: projects.create.wait
    label: Log wait
    category: Projects
    permission: projects.manage
  - id: projects.create.exception
    label: Raise exception
    category: Projects
    permission: projects.manage
  - id: projects.create.decision
    label: Record decision
    category: Projects
    permission: projects.manage
  - id: projects.create.review
    label: Start Project Review
    category: Projects
    permission: projects.manage
  - id: projects.open.raci
    label: Open Responsibility Matrix
    category: Projects
    permission: projects.view
  - id: projects.cross.workflow
    label: Jump to APZ Workflow
    category: Projects
    permission: projects.view
  - id: projects.cross.documents
    label: Jump to APZ Documents
    category: Projects
    permission: projects.view
  - id: project.open
    label: Open Project
    category: Projects
    permission: projects.view
  - id: project.create
    label: Create Project
    category: Projects
    permission: projects.manage
  - id: project.update
    label: Update Project
    category: Projects
    permission: projects.manage
  - id: task.open
    label: Open Task
    category: Projects
    permission: projects.task.view
  - id: task.create
    label: Create Task
    category: Projects
    permission: projects.task.manage
  - id: task.update
    label: Update Task
    category: Projects
    permission: projects.task.manage
  - id: task.assign
    label: Assign Task
    category: Projects
    permission: projects.task.manage
  - id: sprint.open
    label: Open Sprint
    category: Projects
    permission: projects.sprint.view
  - id: sprint.create
    label: Create Sprint
    category: Projects
    permission: projects.sprint.manage
  - id: sprint.complete
    label: Complete Sprint
    category: Projects
    permission: projects.sprint.manage

workbench:
  navigation:
    level: activity-bar
    workspace: projects
    label: Projects
    icon: folder-kanban
    route: /workspace/projects
    order: 20
    permission: projects.view
  view:
    title: APZ Projects
    workspace: projects
    route: /workspace/projects
    default: true
    permission: projects.view
  actions:
    - id: projects.goto.workspace
      label: Go to Operational Workspace
      handler: route:/workspace/projects
      permission: projects.view
      palette: true
      group: Projects
      icon: layout-dashboard
      order: 1
      description: Navigate to the Operational Workspace.
    - id: projects.goto.portfolio
      label: Open Portfolio Scorecard
      handler: route:/workspace/projects/portfolio
      permission: projects.view
      palette: true
      group: Projects
      icon: layers
      order: 2
      description: Open the executive Portfolio Scorecard.
    - id: projects.goto.queue
      label: Open Focus Queue
      handler: route:/workspace/projects?focus=queue
      permission: projects.view
      palette: true
      group: Projects
      icon: list-checks
      order: 3
      description: Jump to the Focus Queue on Operational Workspace.
    - id: projects.goto.search
      label: Open Search
      handler: route:/workspace/projects/search
      permission: projects.view
      palette: true
      group: Projects
      icon: search
      order: 4
      description: Open enterprise search in APZ Projects.
    - id: projects.goto.reviews
      label: Open Review Calendar
      handler: route:/workspace/projects/reviews
      permission: projects.view
      palette: true
      group: Projects
      icon: clipboard-check
      order: 5
      description: Open the Operational Review calendar.
    - id: projects.goto.reports
      label: Open Reports Catalogue
      handler: route:/workspace/projects/reports
      permission: projects.view
      palette: true
      group: Projects
      icon: file-bar-chart
      order: 6
      description: Open the operational report catalogue.
    - id: projects.goto.productivity
      label: Open Productivity
      handler: route:/workspace/projects/productivity
      permission: projects.view
      palette: true
      group: Projects
      icon: zap
      order: 7
      description: Open Favourites, Recents, Saved searches, and Sessions.
    - id: projects.quick-action
      label: Quick Action…
      handler: service:projects-productivity:quick-action
      permission: projects.view
      palette: true
      group: Projects
      icon: plus-circle
      order: 8
      description: Create Project, Commitment, Milestone, Decision, Risk, Exception, Review, or Note.
    - id: projects.create.commitment
      label: New commitment (current project)
      handler: service:projects-productivity:create.commitment
      permission: projects.manage
      palette: true
      group: Projects
      icon: check-circle
      order: 9
      description: Create a commitment in the current project context.
    - id: projects.create.wait
      label: Log wait
      handler: service:projects-productivity:create.wait
      permission: projects.manage
      palette: true
      group: Projects
      icon: clock
      order: 10
      description: Log a wait against the current operational context.
    - id: projects.create.exception
      label: Raise exception
      handler: service:projects-productivity:create.exception
      permission: projects.manage
      palette: true
      group: Projects
      icon: alert-triangle
      order: 11
      description: Raise an exception in the current project.
    - id: projects.create.decision
      label: Record decision
      handler: service:projects-productivity:create.decision
      permission: projects.manage
      palette: true
      group: Projects
      icon: gavel
      order: 12
      description: Record a decision in the current project.
    - id: projects.create.review
      label: Start Project Review
      handler: route:/workspace/projects/reviews
      permission: projects.manage
      palette: true
      group: Projects
      icon: clipboard-list
      order: 13
      description: Start or schedule a Project Review.
    - id: projects.open.raci
      label: Open Responsibility Matrix
      handler: service:projects-productivity:open.raci
      permission: projects.view
      palette: true
      group: Projects
      icon: users
      order: 14
      description: Open the Responsibility Matrix for the current project.
    - id: projects.cross.workflow
      label: Jump to APZ Workflow
      handler: route:/workspace/workflow
      permission: projects.view
      palette: true
      group: Cross-product
      icon: git-branch
      order: 15
      description: Navigate to APZ Workflow with enterprise context.
    - id: projects.cross.documents
      label: Jump to APZ Documents
      handler: route:/workspace/documents
      permission: projects.view
      palette: true
      group: Cross-product
      icon: file-text
      order: 16
      description: Navigate to APZ Documents with enterprise context.
    - id: project.open
      label: Open Project
      handler: service:project-service:workbench.open
      permission: projects.view
      palette: true
      group: Projects
      icon: folder
      order: 20
      description: Open a project in APZ Projects.
    - id: project.create
      label: Create Project
      handler: service:project-service:workbench.create
      permission: projects.manage
      palette: true
      group: Projects
      icon: plus
      order: 30
      description: Create a new project in APZ Projects.
    - id: project.update
      label: Update Project
      handler: service:project-service:workbench.update
      permission: projects.manage
      palette: true
      group: Projects
      icon: pencil
      order: 30
      description: Update project settings in APZ Projects.
    - id: task.open
      label: Open Task
      handler: service:project-service:workbench.task.open
      permission: projects.task.view
      palette: true
      group: Projects
      icon: check-square
      order: 40
      description: Open a task in APZ Projects.
    - id: task.create
      label: Create Task
      handler: service:project-service:workbench.task.create
      permission: projects.task.manage
      palette: true
      group: Projects
      icon: plus-square
      order: 50
      description: Create a task in APZ Projects.
    - id: task.update
      label: Update Task
      handler: service:project-service:workbench.task.update
      permission: projects.task.manage
      palette: true
      group: Projects
      icon: pencil-line
      order: 60
      description: Update a task in APZ Projects.
    - id: task.assign
      label: Assign Task
      handler: service:project-service:workbench.task.assign
      permission: projects.task.manage
      palette: true
      group: Projects
      icon: user-plus
      order: 70
      description: Assign a task in APZ Projects.
    - id: sprint.open
      label: Open Sprint
      handler: service:project-service:workbench.sprint.open
      permission: projects.sprint.view
      palette: true
      group: Projects
      icon: calendar
      order: 80
      description: Open sprint view in APZ Projects.
    - id: sprint.create
      label: Create Sprint
      handler: service:project-service:workbench.sprint.create
      permission: projects.sprint.manage
      palette: true
      group: Projects
      icon: calendar-plus
      order: 90
      description: Create a sprint in APZ Projects.
    - id: sprint.complete
      label: Complete Sprint
      handler: service:project-service:workbench.sprint.complete
      permission: projects.sprint.manage
      palette: true
      group: Projects
      icon: calendar-check
      order: 100
      description: Complete active sprint in APZ Projects.

documentation:
  plannedRouteProjectDetail: "/workspace/projects/{projectId}"
  engineBranding: hidden

tests:
  manifest: true
  e2e: true

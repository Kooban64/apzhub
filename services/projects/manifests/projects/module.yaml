manifestSchemaVersion: "1.0"
id: projects
name: Projects
version: 0.1.0
kind: module

metadata:
  category: productivity
  description: APZHUB Projects workbench — project, task, sprint, backlog, and roadmap management.
  owner: APZHUB
  icon: folder-kanban
  tags:
    - projects
    - tasks
    - sprints
    - backlog
    - roadmap

dependencies:
  platform: []
  services:
    - project-service

compatibility:
  platformVersion: ">=0.1.0"

module:
  category: productivity
  status: enabled
  description: Projects capability module (APZHUB-PROJECTS-001 Workbench Phase 1).

permissions:
  - id: projects.view
    description: View projects workspace and project list.
  - id: projects.manage
    description: Create and update projects.
  - id: projects.task.view
    description: View tasks, backlog, and board.
  - id: projects.task.manage
    description: Create, update, assign, and transition tasks.
  - id: projects.sprint.view
    description: View sprints and sprint board.
  - id: projects.sprint.manage
    description: Create, start, and complete sprints.
  - id: projects.admin
    description: Administer project settings, team, and archive projects.

navigation:
  activityBar:
    enabled: true
    label: Projects
    icon: folder-kanban
    order: 20
    permission: projects.view
  sidebar:
    - id: projects.dashboard
      label: Dashboard
      route: /workspace/projects
      icon: layout-dashboard
      permission: projects.view
    - id: projects.list
      label: All Projects
      route: /workspace/projects/list
      icon: folder
      permission: projects.view
    - id: projects.my-work
      label: My Work
      route: /workspace/projects/my-work
      icon: user
      permission: projects.task.view
    - id: projects.tasks
      label: Tasks
      route: /workspace/projects/tasks
      icon: check-square
      permission: projects.task.view
    - id: projects.backlog
      label: Backlog
      route: /workspace/projects/backlog
      icon: list
      permission: projects.task.view
    - id: projects.sprints
      label: Sprints
      route: /workspace/projects/sprints
      icon: calendar
      permission: projects.sprint.view
    - id: projects.roadmap
      label: Roadmap
      route: /workspace/projects/roadmap
      icon: map
      permission: projects.view
    - id: projects.search
      label: Search
      route: /workspace/projects/search
      icon: search
      permission: projects.view
    - id: projects.health
      label: Health
      route: /workspace/projects/health
      icon: activity
      permission: projects.view

commands:
  - id: project.open
    label: Open Project
    category: Projects
    permission: projects.view
  - id: project.create
    label: Create Project
    category: Projects
    permission: projects.manage
  - id: project.update
    label: Update Project
    category: Projects
    permission: projects.manage
  - id: task.open
    label: Open Task
    category: Projects
    permission: projects.task.view
  - id: task.create
    label: Create Task
    category: Projects
    permission: projects.task.manage
  - id: task.update
    label: Update Task
    category: Projects
    permission: projects.task.manage
  - id: task.assign
    label: Assign Task
    category: Projects
    permission: projects.task.manage
  - id: sprint.open
    label: Open Sprint
    category: Projects
    permission: projects.sprint.view
  - id: sprint.create
    label: Create Sprint
    category: Projects
    permission: projects.sprint.manage
  - id: sprint.complete
    label: Complete Sprint
    category: Projects
    permission: projects.sprint.manage

workbench:
  navigation:
    level: activity-bar
    workspace: projects
    label: Projects
    icon: folder-kanban
    route: /workspace/projects
    order: 20
    permission: projects.view
  view:
    title: Projects
    workspace: projects
    route: /workspace/projects
    default: true
    permission: projects.view
  actions:
    - id: project.open
      label: Open Project
      handler: service:project-service:workbench.open
      permission: projects.view
      palette: true
      group: Projects
      icon: folder
      order: 10
      description: Open a project in the Projects workspace (APZHUB-PROJECTS-001).
    - id: project.create
      label: Create Project
      handler: service:project-service:workbench.create
      permission: projects.manage
      palette: true
      group: Projects
      icon: plus
      order: 20
      description: Create a new project (APZHUB-PROJECTS-001).
    - id: project.update
      label: Update Project
      handler: service:project-service:workbench.update
      permission: projects.manage
      palette: true
      group: Projects
      icon: pencil
      order: 30
      description: Update project settings (APZHUB-PROJECTS-001).
    - id: task.open
      label: Open Task
      handler: service:project-service:workbench.task.open
      permission: projects.task.view
      palette: true
      group: Projects
      icon: check-square
      order: 40
      description: Open a task (APZHUB-PROJECTS-001).
    - id: task.create
      label: Create Task
      handler: service:project-service:workbench.task.create
      permission: projects.task.manage
      palette: true
      group: Projects
      icon: plus-square
      order: 50
      description: Create a task (APZHUB-PROJECTS-001).
    - id: task.update
      label: Update Task
      handler: service:project-service:workbench.task.update
      permission: projects.task.manage
      palette: true
      group: Projects
      icon: pencil-line
      order: 60
      description: Update a task (APZHUB-PROJECTS-001).
    - id: task.assign
      label: Assign Task
      handler: service:project-service:workbench.task.assign
      permission: projects.task.manage
      palette: true
      group: Projects
      icon: user-plus
      order: 70
      description: Assign a task (APZHUB-PROJECTS-001).
    - id: sprint.open
      label: Open Sprint
      handler: service:project-service:workbench.sprint.open
      permission: projects.sprint.view
      palette: true
      group: Projects
      icon: calendar
      order: 80
      description: Open sprint view (APZHUB-PROJECTS-001).
    - id: sprint.create
      label: Create Sprint
      handler: service:project-service:workbench.sprint.create
      permission: projects.sprint.manage
      palette: true
      group: Projects
      icon: calendar-plus
      order: 90
      description: Create a sprint (APZHUB-PROJECTS-001).
    - id: sprint.complete
      label: Complete Sprint
      handler: service:project-service:workbench.sprint.complete
      permission: projects.sprint.manage
      palette: true
      group: Projects
      icon: calendar-check
      order: 100
      description: Complete active sprint (APZHUB-PROJECTS-001).

documentation:
  plannedRouteProjectDetail: "/workspace/projects/{projectId}"
  engineBranding: hidden

tests:
  manifest: true
  e2e: true

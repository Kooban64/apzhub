manifestSchemaVersion: "1.0"
id: support-search
name: Search
version: 0.1.0
kind: module

metadata:
  category: support
  description: Support — Cross-entity search within the Support domain.

dependencies:
  platform: []
  services:
    - support-service

module:
  category: support
  status: enabled

workbench:

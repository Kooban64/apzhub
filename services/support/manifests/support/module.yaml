manifestSchemaVersion: "1.0"
id: support
name: APZ Support
version: 0.1.0
kind: module

metadata:
  category: support
  description: APZ Support — ask for help, follow progress, communicate, and reach resolution inside APZHUB.
  owner: APZHUB
  icon: life-buoy
  tags:
    - support
    - requests
    - helpdesk

dependencies:
  platform: []
  services:
    - support-service

compatibility:
  platformVersion: ">=0.1.0"

module:
  category: support
  status: enabled
  description: APZ Support native workspace module.

workbench:
  navigation:
    level: activity-bar
    workspace: support
    label: Support
    icon: life-buoy
    route: /workspace/support
    order: 30
    permission: support.requests.list
  view:
    title: APZ Support
    workspace: support
    route: /workspace/support
    default: true
    permission: support.requests.list

documentation:
  engineBranding: hidden

tests:
  manifest: true
  e2e: planned

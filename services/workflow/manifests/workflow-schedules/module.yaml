    level: sidebar
    workspace: workflow
    parent: workflow
    label: Operational timing
    icon: calendar-clock
    route: /workspace/workflow/schedules
    order: 30
    permission: workflow.admin
  view:
    title: Operational timing
    workspace: workflow
    route: /workspace/workflow/schedules
    permission: workflow.admin

manifestSchemaVersion: "1.0"
id: workflow-schedules
name: Schedules
version: 0.1.0
kind: module

metadata:
  category: workflow
  description: Workflow Workbench — Schedules view (APZHUB-PLATFORM-WORKFLOW-006).

dependencies:
  platform: []
  services:
    - workflow-service

module:
  category: workflow
  status: enabled

workbench:
  navigation:
    level: sidebar
    workspace: workflow
    parent: workflow
    label: Schedules
    icon: calendar-clock
    route: /workspace/workflow/schedules
    order: 30
    permission: workflow.schedules.view
  view:
    title: Schedules
    workspace: workflow
    route: /workspace/workflow/schedules
    permission: workflow.schedules.view

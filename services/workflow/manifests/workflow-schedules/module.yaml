manifestSchemaVersion: "1.0"
id: workflow-schedules
name: Operational timing
version: 0.1.0
kind: module

metadata:
  category: workflow
  description: Workflow Workbench — Schedules view (APZHUB-PLATFORM-WORKFLOW-006).

dependencies:
  platform: []
  services:
    - workflow-service

module:
  category: workflow
  status: enabled

workbench:

manifestSchemaVersion: "1.0"
id: workflow
name: Workflow
version: 0.1.0
kind: module

metadata:
  category: workflow
  description: >
    APZHUB Workflow Workbench module (APZHUB-PLATFORM-WORKFLOW-006).
    Presentation over Workflow HTTP API `/api/v1/workflow/*` only.
    Distinct from Platform Workflows SoR (`/workspace/workflows`) and Workflow Engine.
  owner: APZHUB
  icon: workflow
  tags:
    - workflow
    - orchestration
    - workbench

dependencies:
  platform: []
  services:
    - workflow-service

compatibility:
  platformVersion: ">=0.1.0"

module:
  category: workflow
  status: enabled
  description: Workflow Workbench module (APZHUB-PLATFORM-WORKFLOW-006).

permissions:
  - id: workflow.view
    description: View Workflow workspace and definitions.
  - id: workflow.runs.view
    description: View workflow runs.
  - id: workflow.runs.start
    description: Start workflow runs.
  - id: workflow.runs.cancel
    description: Cancel workflow runs.
  - id: workflow.schedules.view
    description: View workflow schedules.
  - id: workflow.schedules.manage
    description: Manage workflow schedules.
  - id: workflow.tasks.view
    description: View workflow tasks and approvals.
  - id: workflow.tasks.claim
    description: Claim workflow tasks.
  - id: workflow.tasks.complete
    description: Complete workflow tasks.
  - id: workflow.tasks.approve
    description: Approve or reject approval tasks.
  - id: workflow.engine.health
    description: View workflow health.
  - id: workflow.engine.capabilities
    description: View workflow capabilities.

navigation:
  activityBar:
    enabled: true
    label: APZ Workflow
    icon: workflow
    order: 29
    permission: workflow.view
  sidebar:
    - id: workflow.home
      label: Home
      route: /workspace/workflow
      icon: layout-dashboard
      permission: workflow.view
    - id: workflow.journeys
      label: Journeys
      route: /workspace/workflow/journeys
      icon: map
      permission: workflow.view
    - id: workflow.definitions
      label: Processes
      route: /workspace/workflow/definitions
      icon: file-code
      permission: workflow.view
    - id: workflow.runs
      label: Operational history
      route: /workspace/workflow/runs
      icon: play
      permission: workflow.admin
    - id: workflow.schedules
      label: Operational timing
      route: /workspace/workflow/schedules
      icon: calendar-clock
      permission: workflow.admin
    - id: workflow.tasks
      label: Participants
      route: /workspace/workflow/tasks
      icon: list-todo
      permission: workflow.tasks.view
    - id: workflow.approvals
      label: Approvals
      route: /workspace/workflow/approvals
      icon: check-circle
      permission: workflow.tasks.view
    - id: workflow.notifications
      label: Notifications
      route: /workspace/workflow/notifications
      icon: bell
      permission: workflow.admin
    - id: workflow.search
      label: Search
      route: /workspace/workflow/search
      icon: search
      permission: workflow.view
    - id: workflow.health
      label: Health
      route: /workspace/workflow/health
      icon: activity
      permission: workflow.admin
    - id: workflow.diagnostics
      label: Diagnostics
      route: /workspace/workflow/diagnostics
      icon: stethoscope
      permission: workflow.admin
    - id: workflow.capabilities
      label: Capabilities
      route: /workspace/workflow/capabilities
      icon: puzzle
      permission: workflow.admin
    - id: workflow.help
      label: Help
      route: /workspace/workflow/help
      icon: circle-help
      permission: workflow.view
    - id: workflow.settings
      label: Settings
      route: /workspace/workflow/settings
      icon: settings
      permission: workflow.view

commands:
  - id: workflow.home.open
    label: Open APZ Workflow Home
    category: Workflow
    permission: workflow.view
  - id: workflow.definitions.open
    label: Open Processes
    category: Workflow
    permission: workflow.view
  - id: workflow.runs.open
    label: Open Operational history
    category: Workflow
    permission: workflow.admin
  - id: workflow.tasks.open
    label: Open Participants
    category: Workflow
    permission: workflow.tasks.view
  - id: workflow.search.open
    label: Search processes
    category: Workflow
    permission: workflow.view
  - id: workflow.health.open
    label: Open operator health
    category: Workflow
    permission: workflow.admin

workbench:
  navigation:
    level: activity-bar
    workspace: workflow
    label: APZ Workflow
    icon: workflow
    route: /workspace/workflow
    order: 29
    permission: workflow.view
  view:
    title: APZ Workflow
    workspace: workflow
    route: /workspace/workflow
    default: true
    permission: workflow.view
  actions:
    - id: workflow.home.open
      label: Open APZ Workflow Home
      handler: workbench-bridge:workbench.navigation.reveal
      permission: workflow.view
      palette: true
      group: APZ Workflow
      icon: layout-dashboard
      order: 10
      description: Open APZ Workflow Home in the Workbench.
    - id: workflow.definitions.open
      label: Open Processes
      handler: workbench-bridge:workbench.navigation.reveal
      permission: workflow.view
      palette: true
      group: APZ Workflow
      icon: file-code
      order: 20
      description: Open Processes.
    - id: workflow.runs.open
      label: Open Operational history
      handler: workbench-bridge:workbench.navigation.reveal
      permission: workflow.admin
      palette: true
      group: APZ Workflow
      icon: play
      order: 30
      description: Open Operational history.
    - id: workflow.tasks.open
      label: Open Participants
      handler: workbench-bridge:workbench.navigation.reveal
      permission: workflow.tasks.view
      palette: true
      group: APZ Workflow
      icon: list-todo
      order: 40
      description: Open Participants.
    - id: workflow.search.open
      label: Search processes
      handler: workbench-bridge:workbench.navigation.reveal
      permission: workflow.view
      palette: true
      group: APZ Workflow
      icon: search
      order: 50
      description: Search business processes.
    - id: workflow.health.open
      label: Open operator health
      handler: workbench-bridge:workbench.navigation.reveal
      permission: workflow.admin
      palette: true
      group: APZ Workflow
      icon: activity
      order: 60
      description: Open operator health (secondary).
